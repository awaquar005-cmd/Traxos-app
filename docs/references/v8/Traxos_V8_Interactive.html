function transactionIcon(t){const c=String(t.category||'').toLowerCase();let type='tag',tone='purple';if(/food|coffee|lunch|dinner|groc/.test(c)){type='gift';tone='amber'}else if(/transport|fuel|cab/.test(c)){type='transfer';tone='blue'}else if(/rent|bill|electric/.test(c)){type='home';tone='slate'}else if(/shopping/.test(c)){type='wallet';tone='purple'}else if(/entertainment|music/.test(c)){type='spark';tone='rose'}else if(/health/.test(c)){type='shield';tone='teal'}else if(/salary|freelance|income/.test(c)){type='chart';tone='teal'}if(t.type==='transfer'){type='transfer';tone='blue'}if(['groupExpense','groupShare','groupSettlement'].includes(t.type)){type='users';tone='purple'}return `<span class="icon-tile tx-${tone}">${icon(type)}</span>`;}

function txIconName(t){
  const tag=[t.type,t.category,t.title,t.note].filter(Boolean).join(' ').toLowerCase();
  if(t.type==='transfer'||tag.includes('transfer'))return 'transfer';
  if(['income','refund','repayLend','borrow'].includes(t.type)||(t.type==='groupSettlement'&&t.direction==='received'))return 'chart';
  if(/grocery|mart|shopping|shop|store/.test(tag))return 'bag';
  if(/fuel|petrol|transport|taxi|bus|metro/.test(tag))return 'transfer';
  if(/salary|interest|cashback/.test(tag))return 'chart';
  if(/bill|rent|subscription|recharge|electric/.test(tag))return 'calendar';
  if(/restaurant|lunch|dinner|food|tea|coffee|snack/.test(tag))return 'spark';

function txItem(t){const acc=accountBy(t.accountId);const isIncome=['income','refund','repayLend','borrow'].includes(t.type)||(t.type==='groupSettlement'&&t.direction==='received');const isTransfer=t.type==='transfer';const display=t.title||t.category||titleCase(t.type);return `<button class="pr-tx" data-action="transactionDetail" data-id="${esc(t.id)}" aria-label="Open ${esc(display)} transaction"><span class="pr-tx-symbol icon-only" aria-hidden="true">${icon(txIconName(t),'icon-sm')}</span><span class="pr-tx-content"><strong class="ellipsis">${esc(display)}</strong><small class="ellipsis">${esc(acc?.name||'No account')} · ${dateLocal(t.date)}</small></span><span class="pr-tx-value"><strong class="${isIncome?'positive':''}">${isIncome?'+':isTransfer?'':'−'}${justAmount(t.amount)}</strong><small>${isTransfer?'Transfer':isIncome?'Income':esc(t.category||'Expense')}</small></span></button>`;}

urrency)}</strong></button>`).join('')}</div></div>`;}
function activity(){const types=['All','Expenses','Income','Transfers','Card payments'];let items=store.transactions.filter(x=>!x.deleted);const q=ui.search.toLowerCase().trim();if(q)items=items.filter(t=>[t.title,t.category,t.note,accountName(t.accountId)].join(' ').toLowerCase().includes(q));if(ui.activityAccount!=='all')items=items.filter(t=>t.accountId===ui.activityAccount||t.toAccountId===ui.activityAccount);if(ui.activityType!=='All')items=items.filter(t=>ui.activityType==='Expenses'?['expense','groupExpense','groupShare'].includes(t.type):ui.activityType==='Income'?['income','refund'].includes(t.type):ui.activityType==='Transfers'?t.type==='transfer':(t.type==='transfer'&&accountBy(t.toAccountId)?.type==='credit'));items.sort((a,b)=>(ui.activitySort==='Oldest first'?1:-1)*(a.date.localeCompare(b.date)||(a.createdAt-b.createdAt)));return `<div class="pr-internal"><div class="pr-intro"><h2>Every transaction.</h2><p>Find anything. Fix anything.</p></div><label class="pr-search">${icon('search')}<input type="search" id="searchField" data-bind-ui="search" placeholder="Search activity" value="${esc(ui.search)}" aria-label="Search activity" /></label><div class="pr-filters">${types.map(t=>`<button class="${ui.activityType===t?'selected':''}" data-action="activityType" data-value="${t}">${t}</button>`).join('')}</div><div class="pr-ledger-actions"><span>${items.length} ${items.length===1?'entry':'entries'}</span><div><button data-action="sheetFilters">Filter</button><button data-action="sheetSort">Sort</button></div></div><div class="pr-transaction-list pr-ledger-list">${items.length?items.map(txItem).join(''):blank('No matching entries','Try another search or filter.',q||ui.activityType!=='All'?'resetFilters':'addTransaction',q||ui.activityType!=='All'?'Clear filters':'Add transaction','search')}</div><button class="pr-quiet-link" data-action="openPage" data-page="reports">Explore monthly insights <span>›</span></button></div>`;}

nput" type="date" data-bind="date" value="${esc(f.date)}" /></div><div class="field"><label class="label">Note (optional)</label><textarea class="textarea" data-bind="note" placeholder="Add context only if you need it">${esc(f.note||'')}</textarea></div>${!isTransfer?`<button class="pr-refund" data-action="chooseTxType" data-value="${f.type==='refund'?'expense':'refund'}">${f.type==='refund'?'Use regular expense':'Record as refund instead'}</button>`:''}</div>`:''}<p class="pr-draft-note">Your entry is saved locally first. Internet isn't needed.</p></div>`;}

function remindersPage(){const upcoming=[...upcomingRecurring().map(r=>({title:r.name,desc:`${amount(r.amount)} · ${r.frequency}`,date:r.nextDate,action:'recurringDetail',id:r.id})),...store.debts.filter(d=>d.dueDate&&d.amount>d.settled).map(d=>({title:`${d.person} · ${d.kind==='lend'?'owes you':'you owe'}`,desc:amount(d.amount-d.settled),date:d.dueDate,action:'debtDetail',id:d.id}))].sort((a,b)=>a.date.localeCompare(b.date)).slice(0,8);return upcoming.length?upcoming.map(r=>`<button class="option-row" data-action="${r.action}" data-id="${r.id}"><span><strong>${esc(r.title)}</strong><span class="line-sub" style="display:block">${esc(r.desc)} · Due ${dateLocal(r.date)}</span></span>${icon('chevron')}</button>`).join(''):blank('No upcoming reminders','Create a subscription or debt with a due date to see it here.','addRecurring','Add subscription','bell');}
function plansPage(){const st=monthStats();const month=currentMonth();const budgets=store.budgets.filter(b=>b.month===month);const first=budgets.find(b=>b.category==='All spending')||budgets[0];const spent=first?(first.category==='All spending'?st.spend:st.categories[first.category]||0):0;const percent=first?Math.round(spent/Math.max(1,first.limit)*100):0;const next=upcomingRecurring();return `<div class="pr-internal"><div class="pr-intro"><h2>Make room for plans.</h2><p>Budgets, savings and bills in one place.</p></div><div class="pr-section-head"><h2>Monthly budget</h2><button data-action="addBudget">${first?'Edit / add':'Create'} <span>›</span></button></div>${first?`<button class="pr-plan-feature" data-action="editBudget" data-id="${first.id}"><small>${esc(first.category)} · ${monthName(month)}</small><strong>${ui.hiddenAmounts?'••••':amount(Math.max(0,first.limit-spent))}<span> left</span></strong><div class="pr-budget-track"><div style="width:${Math.min(100,Math.max(0,percent))}%"></div></div><div class="pr-plan-foot"><span>${percent}% spent</span><span>Limit ${amount(first.limit)}</span></div></button>`:blank('A budget starts with one number','Set a monthly amount and track your spending against it.','addBudget','Create budget','target')}<div class="pr-section-head pr-after"><h2>Savings goals</h2><button data-action="addGoal">New goal <span>›</span></button></div><div class="pr-simple-list">${store.goals.length?store.goals.map(g=>{const per=Math.min(100,Math.round(g.saved/Math.max(1,g.target)*100));return `<button class="pr-plan-line" data-action="goalDetail" data-id="${g.id}"><span><strong>${esc(g.name)}</strong><small>${amount(g.saved)} of ${amount(g.target)}</small></span><span>${per}%</span><div class="pr-budget-track"><div style="width:${per}%"></div></div></button>`;}).join(''):blank('Save for something meaningful','Create a goal without counting savings as spending.','addGoal','Create goal')}</div><div class="pr-section-head pr-after"><h2>Upcoming bills</h2><button data-action="openPage" data-page="recurring">See all <span>›</span></button></div><div class="pr-simple-list">${next.slice(0,3).map(r=>`<button class="pr-bill-line" data-action="recurringDetail" data-id="${r.id}"><span><strong>${esc(r.name)}</strong><small>Due ${dateLocal(r.nextDate)} · not yet spent</small></span><strong>${amount(r.amount)}</strong></button>`).join('')||blank('No upcoming bills','Add reminders for rent, subscriptions or other recurring payments.','addRecurring','Add bill')}</div></div>`;}

function groupsPage(){const groups=store.groups;const total=groups.reduce((n,g)=>n+(groupNet(g).You||0),0);return `<div class="pr-internal"><div class="pr-title-line"><div><h2>Shared expenses</h2><p>Split fairly. Settle simply.</p></div><button class="pr-small-primary" data-action="addGroup">+ New</button></div><div class="pr-split-summary"><span>ACROSS YOUR GROUPS</span><strong>${ui.hiddenAmounts?'••••':amount(Math.abs(total))}</strong><small>${total>0?'Others owe you':total<0?'You owe others':'All settled'}</small></div><div class="pr-two-links"><button data-action="addGroup">New group <span>›</span></button><button data-action="openPage" data-page="debts">Personal debts <span>›</span></button></div><div class="pr-section-head"><h2>Your groups</h2><span>${groups.length} total</span></div><div class="pr-simple-list">${groups.length?groups.map(g=>{const balance=groupNet(g).You||0;const exp=store.groupExpenses.filter(x=>x.groupId===g.id);return `<button class="pr-account-line" data-action="groupDetail" data-id="${g.id}"><span class="pr-account-letter">${esc(g.name[0].toUpperCase())}</span><span class="pr-account-name"><strong>${esc(g.name)}</strong><small>${g.members.length} people · ${exp.length} expenses</small></span><span class="pr-account-amount">${ui.hiddenAmounts?'••••':amount(Math.abs(balance))}<small>${balance>0?'You are owed':balance<0?'You owe':'Settled'}</small></span></button>`;}).join(''):blank('No shared groups yet','Make a group for trips, roommates or shared bills.','addGroup','Create group')}</div><p class="pr-footnote">Shared changes remain on this phone until a native cloud sync is configured.</p></div>`;}
function groupNet(g){const result={};if(!g)return result;g.members.forEach(x=>result[x]=0);for(const e of store.groupExpenses.filter(e=>e.groupId===g.id)){result[e.paidBy]=(result[e.paidBy]||0)+e.amount;for(const [member,share] of Object.entries(e.shares||{}))result[member]=(result[member]||0)-share;}for(const s of store.groupSettlements.filter(s=>s.groupId===g.id)){result[s.from]=(result[s.from]||0)+s.amount;result[s.to]=(result[s.to]||0)-s.amount;}return result;}
function groupDetail(){const g=store.groups.find(x=>x.id===ui.params.id);if(!g)return '';const net=groupNet(g);const items=store.groupExpenses.filter(e=>e.groupId===g.id);return `<div class="card"><div class="row between"><div><h2 style="margin:0 0 4px">${esc(g.name)}</h2><span class="hint">${g.members.length} members · Local-only preview</span></div>${icon('users','icon-lg')}</div><div class="divider"></div><div class="row between"><span class="muted small">Your group balance</span><span class="large-value ${net.You>=0?'text-teal':'text-red'}">${amount(net.You||0)}</span></div></div><div class="btn-row mt16">${button('addGroupExpense','+ Add expense','primary two',`data-id="${g.id}"`)}${button('settleGroup','Settle','secondary two',`data-id="${g.id}"`)}</div>${section('Members')}<div class="settings-group">${g.members.map(m=>`<div class="option-row"><span>${esc(m)} ${m==='You'?'<span class="tag">You</span>':''}</span><strong class="${(net[m]||0)>=0?'text-teal':'text-red'}">${amount(net[m]||0)}</strong></div>`).join('')}</div>${section('Shared expenses')}${items.length?items.slice().reverse().map(e=>`<div class="card mb12"><div class="row between"><strong>${esc(e.title)}</strong><strong>${amount(e.amount)}</strong></div><div class="hint mt8">Paid by ${esc(e.paidBy)} · ${dateLocal(e.date)}</div><div class="hint mt8">Your share ${amount(e.shares.You||0)} · ${esc(e.splitMode)}</div></div>`).join(''):blank('No group expenses','Record the first shared bill.','addGroupExpense','Add group expense','users')}`;}
function groupForm(){if(!('name' in ui.form))ui.form={name:'',members:'Aman, Priya'};return `${fmtField('Group name','name','text',ui.form.name,'placeholder="e.g. Weekend trip"')}${fmtField('Members (comma-separated)','members','text',ui.form.members,'placeholder="Aman, Priya, Kiran"')}<p class="hint">You are automatically included. Invite delivery and server-based group permissions are not part of the HTML demo.</p>`;}
function equalShares(total,members){const q=Math.floor(total/members.length),rem=total%members.length;return Object.fromEntries(members.map((m,i)=>[m,q+(i<rem?1:0)]));}
function groupExpenseForm(){const g=store.groups.find(x=>x.id===ui.params.id);if(!g)return '';if(!('amountText' in ui.form))ui.form={title:'',amountText:'',paidBy:'You',accountId:store.settings.defaultAccount||'bank',splitMode:'equal',date:iso(),shares:{}};const f=ui.form;if(!f.shares)f.shares={};return `${fmtField('What was the expense?','title','text',f.title,'placeholder="e.g. Dinner"')}${fmtField('Total amount','amountText','number',f.amountText,'min="0.01" step="0.01"')}${selectHTML('Paid by','paidBy',g.members.map(m=>[m,m]),f.paidBy)}${f.paidBy==='You'?formSelector('Paid from',accountName(f.accountId),'sheetAccount'):''}${selectHTML('Split method','splitMode',[['equal','Equal'],['exact','Exact amounts'],['percentage','Percentages'],['shares','Shares / weights']],f.splitMode)}${f.splitMode!=='equal'?`<div class="card mb12"><div class="form-title mt0">${f.splitMode==='percentage'?'Percent per person':f.splitMode==='shares'?'Shares per person':'Amount per person'}</div><div class="split-table">${g.members.map(m=>`<div class="split-row"><span>${esc(m)}</span><input type="number" step="0.01" min="0" class="input" data-split-member="${esc(m)}" placeholder="${f.splitMode==='percentage'?'%':f.splitMode==='shares'?'Weight':'₹'}" value="${esc(f.shares[m]??'')}" /></div>`).join('')}</div></div>`:''}${fmtField('Date','date','date',f.date)}<div class="banner">${icon('info')}<span>If you paid, your account decreases by the full payment but only your own share counts as personal spending. The rest is owed back to you.</span></div>`;}
function debtsPage(){return `<div class="header-row"><h2>Debts & people</h2>${button('addDebt','+ Add debt','primary slim')}</div><div class="stat-grid mb12"><div class="stat"><div class="stat-label">Owed to you</div><div class="stat-value">${amount(store.debts.filter(d=>d.kind==='lend').reduce((a,d)=>a+d.amount-d.settled,0))}</div></div><div class="stat"><div class="stat-label">You owe</div><div class="stat-value">${amount(store.debts.filter(d=>d.kind==='borrow').reduce((a,d)=>a+d.amount-d.settled,0))}</div></div></div>${store.debts.length?store.debts.map(d=>`<button class="card clickable w100 mb12" data-action="debtDetail" data-id="${d.id}" style="text-align:left;color:var(--text);border:0"><div class="row between"><strong>${esc(d.person)}</strong><span class="tag ${d.kind==='lend'?'teal':'amber'}">${d.kind==='lend'?'Owes you':'You owe'}</span></div><div class="large-value mt16">${amount(d.amount-d.settled)}</div><div class="hint mt8">${esc(d.reason||'Personal debt')} ${d.dueDate?'· Due '+dateLocal(d.dueDate):''}</div></button>`).join(''):blank('No personal debts','Track money lent or borrowed without counting the principal as income or spending.','addDebt','Add debt','users')}`;}
function debtForm(){if(!('person' in ui.form))ui.form={person:'',kind:'lend',amountText:'',accountId:store.settings.defaultAccount||'bank',reason:'',date:iso(),dueDate:'',phone:''};const f=ui.form;return `<div class="segmented mb12"><button class="segment ${f.kind==='lend'?'active':''}" data-action="debtKind" data-value="lend">Lent money</button><button class="segment ${f.kind==='borrow'?'active':''}" data-action="debtKind" data-value="borrow">Borrowed</button></div>${fmtField('Person','person','text',f.person,'placeholder="e.g. Aman"')}${fmtField('Amount','amountText','number',f.amountText,'min="0.01" step="0.01"')}${formSelector('Cash account',accountName(f.accountId),'sheetAccount')}${fmtField('Reason','reason','text',f.reason,'placeholder="e.g. Shared dinner"')}<div class="input-row">${fmtField('Start date','date','date',f.date)}${fmtField('Due date','dueDate','date',f.dueDate)}</div>${fmtField('Phone (optional)','phone','tel',f.phone,'placeholder="+91…"')}<p class="hint">The demo records an account movement for the principal, separate from income and expense totals.</p>`;}
function debtDetail(){const d=store.debts.find(x=>x.id===ui.params.id);if(!d)return '';const due=d.amount-d.settled;return `<div class="card"><div class="row between"><h2 class="mt0">${esc(d.person)}</h2><span class="tag ${d.kind==='lend'?'teal':'amber'}">${d.kind==='lend'?'Owes you':'You owe'}</span></div><div class="upper">Outstanding</div><div class="large-value mt8">${amount(due)}</div><div class="divider"></div><div class="receipt-row"><span>Original amount</span><strong>${amount(d.amount)}</strong></div><div class="receipt-row"><span>Repaid</span><strong>${amount(d.settled)}</strong></div><div class="receipt-row"><span>Reason</span><strong>${esc(d.reason||'—')}</strong></div><div class="receipt-row"><span>Due date</span><strong>${d.dueDate?dateLocal(d.dueDate):'Not set'}</strong></div></div><div class="btn-row mt16">${button('repayDebt',d.kind==='lend'?'Record received':'Record payment','primary two',`data-id="${d.id}"`)}${button('shareDebt','Draft reminder','secondary two',`data-id="${d.id}"`)}</div>${section('History')}<div class="card"><div class="option-row"><span>${d.kind==='lend'?'You lent money':'You borrowed money'} · ${dateLocal(d.date)}</span><strong>${amount(d.amount)}</strong></div>${(d.payments||[]).map(p=>`<div class="option-row"><span>Repayment · ${dateLocal(p.date)}</span><strong>${amount(p.amount)}</strong></div>`).join('')}</div>`;}
function recurringPage(){const items=store.recurring.slice().sort((a,b)=>a.nextDate.localeCompare(b.nextDate));return `<div class="header-row"><h2>Subscriptions & bills</h2>${button('addRecurring','+ Add','primary slim')}</div><div class="banner mb12">${icon('bell')}<span>Upcoming payments are reminders, not posted expenses. Review and confirm when actually paid.</span></div>${items.length?items.map(r=>`<button class="card clickable w100 mb12" style="text-align:left;border:0;color:var(--text)" data-action="recurringDetail" data-id="${r.id}"><div class="row between"><strong>${esc(r.name)}</strong><span class="tag ${r.status==='active'?'teal':'amber'}">${titleCase(r.status)}</span></div><div class="large-value mt16">${amount(r.amount)}</div><div class="hint mt8">${titleCase(r.frequency)} · Next ${dateLocal(r.nextDate)} · ${esc(accountName(r.accountId))}</div></button>`).join(''):blank('No subscriptions yet','Track streaming, rent and other repeat bills. You decide when to record each payment.','addRecurring','Add subscription','repeat')}`;}
function recurringForm(){const x=store.recurring.find(y=>y.id===ui.params.id);if(!('name' in ui.form))ui.form=x?{...x,amountText:(x.amount/100).toFixed(2)}:{name:'',amountText:'',frequency:'monthly',accountId:store.settings.defaultAccount||'bank',category:'Bills',nextDate:iso(),status:'active',note:''};const f=ui.form;return `${fmtField('Subscription / bill','name','text',f.name,'placeholder="e.g. Spotify"')}${fmtField('Amount','amountText','number',f.amountText,'min="0.01" step="0.01"')}${selectHTML('Repeat','frequency',[['weekly','Weekly'],['monthly','Monthly'],['quarterly','Quarterly'],['yearly','Yearly']],f.frequency)}${fmtField('Next due','nextDate','date',f.nextDate)}${formSelector('Pay from',accountName(f.accountId),'sheetAccount')}${formSelector('Category',f.category||'Bills','sheetCategory')}${selectHTML('Status','status',[['active','Active'],['paused','Paused'],['cancelled','Cancelled']],f.status)}${fmtField('Note','note','text',f.note,'placeholder="Optional"')}<p class="hint">Adding a subscription schedules an expected payment only. No bank charge occurs automatically.</p>`;}
function nextRecurrence(date,frequency){const dt=new Date(`${date}T12:00:00`);if(frequency==='weekly')dt.setDate(dt.getDate()+7);else if(frequency==='quarterly')dt.setMonth(dt.getMonth()+3);else if(frequency==='yearly')dt.setFullYear(dt.getFullYear()+1);else dt.setMonth(dt.getMonth()+1);return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;}
function recurringDetail(){const r=store.recurring.find(x=>x.id===ui.params.id);if(!r)return '';return `<div class="card"><div class="row between"><h2 class="mt0">${esc(r.name)}</h2><span class="tag ${r.status==='active'?'teal':'amber'}">${titleCase(r.status)}</span></div><div class="large-value">${amount(r.amount)}</div><div class="receipt-row"><span>Frequency</span><strong>${titleCase(r.frequency)}</strong></div><div class="receipt-row"><span>Next expected</span><strong>${dateLocal(r.nextDate)}</strong></div><div class="receipt-row"><span>Payment account</span><strong>${esc(accountName(r.accountId))}</strong></div><div class="receipt-row"><span>Category</span><strong>${esc(r.category)}</strong></div></div><div class="btn-row mt16">${button('confirmRecurring','Mark paid & record','primary two',`data-id="${r.id}"`)}${button('editRecurring','Edit rule','secondary two',`data-id="${r.id}"`)}</div><div class="callout">Only choose “Mark paid” when the charge really happened. This demo adds exactly one expense and moves the next expected date forward.</div>`;}
function transactionDetail(){const t=store.transactions.find(x=>x.id===ui.params.id);if(!t)return '';return `<div class="pr-internal"><div class="pr-tx-detail-head"><small>${titleCase(t.type.replace(/([A-Z])/g,' $1'))}</small><h2>${esc(t.title||t.category||'Transaction')}</h2><strong>${signedTransaction(t)}</strong><p>${dateLocal(t.date)}</p></div><div class="pr-section-head pr-after"><h2>Details</h2></div><div class="pr-simple-list"><div class="pr-detail-row"><span>Account</span><b>${esc(accountName(t.accountId))}</b></div>${t.type==='transfer'?`<div class="pr-detail-row"><span>To account</span><b>${esc(accountName(t.toAccountId))}</b></div>`:''}<div class="pr-detail-row"><span>Category</span><b>${esc(t.category||'Not applicable')}</b></div><div class="pr-detail-row"><span>Source</span><b>${esc(titleCase(t.source||'manual'))}</b></div>${t.note?`<div class="pr-detail-row"><span>Note</span><b>${esc(t.note)}</b></div>`:''}</div><div class="pr-two-links"><button data-action="editTransaction" data-id="${t.id}">Edit transaction ›</button><button data-action="deleteTransaction" data-id="${t.id}">Delete ›</button></div></div>`;}
function sheetFrame(title,body,footer=''){const center=['category','account','sort','filters','giftFilter','giftSort','addCategory','confirm'].includes(ui.sheet?.kind);return `<div class="sheet-layer ${center?'pr-dialog-layer':'pr-sheet-layer'}" data-overlay="true"><div class="sheet ${center?'pr-dialog':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">${center?'':`<div class="sheet-handle"></div>`}<div class="sheet-head"><h3>${esc(title)}</h3><button class="icon-btn" data-action="closeSheet" aria-label="Close">${icon('close')}</button></div><div class="pr-dialog-body">${body}</div>${footer?`<div class="sheet-footer">${footer}</div>`:''}</div></div>`;}
function renderSheet(){const s=ui.sheet;if(!s)return '';let options,selected,selAction,title;switch(s.kind){
case 'account':
 options=store.accounts.filter(a=>!a.archived).map(a=>({value:a.id,label:`${a.name} · ${a.currency}`}));selected=ui.form[s.field];selAction='selectAccount';title=s.field==='toAccountId'?'To account':'Account';return sheetFrame(title,`<button class="sheet-option" data-action="addAccount">${icon('plus')} <strong>Add new account</strong></button>${options.map(o=>`<button class="sheet-option" data-action="${selAction}" data-field="${s.field}" data-value="${o.value}"><span class="radio-circle ${selected===o.value?'selected':''}"></span><span>${esc(o.label)}</span></button>`).join('')}`);
case 'category':options=(store.categories[ui.form.type==='income'?'income':'expense']||[]).map(v=>({value:v,label:v}));return sheetFrame('Category',`<button class="sheet-option" data-action="addCategory">${icon('plus')} <strong>Add new category</strong></button>${options.map(o=>`<button class="sheet-option" data-action="selectCategory" data-value="${esc(o.value)}"><span class="radio-circle ${ui.form.category===o.value?'selected':''}"></span>${esc(o.label)}</button>`).join('')}`);
case 'sort':return sheetFrame('Sort transactions',['Newest first','Oldest first'].map(o=>`<button class="sheet-option" data-action="setSort" data-value="${o}"><span class="radio-circle ${ui.activitySort===o?'selected':''}"></span>${o}</button>`).join(''));
case 'filters':return sheetFrame('Filter activity',`<div class="field"><label class="label">Account</label><select class="select" data-filter-account><option value="all">All accounts</option>${store.accounts.map(a=>`<option value="${a.id}" ${ui.activityAccount===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div>`,button('applyFilters','Apply filters','primary full'));
case 'giftFilter':return sheetFrame('Filter gift cards',['All cards','Active','Expiring soon','Redeemed / expired','Archived'].map(v=>`<button class="sheet-option" data-action="selectGiftFilter" data-value="${v}"><span class="radio-circle ${ui.giftFilter===v?'selected':''}"></span>${v}</button>`).join(''));
case 'giftSort':return sheetFrame('Sort gift cards',['Expiry','Name','Balance'].map(v=>`<button class="sheet-option" data-action="selectGiftSort" data-value="${v}"><span class="radio-circle ${ui.giftSort===v?'selected':''}"></span>${v}</button>`).join(''));
case 'addCategory':return sheetFrame('New category',`${fmtField('Category name','categoryName','text',ui.sheetForm.categoryName||'','placeholder="e.g. Fuel"')}${selectHTML('Category type','categoryType',[['expense','Expense'],['income','Income']],ui.sheetForm.categoryType||'expense')}`,button('saveNewCategory','Add category','primary full'));
case 'money':return sheetFrame(s.title,`${s.text?`<p class="hint">${esc(s.text)}</p>`:''}${fmtField('Amount','sheetAmount','number','','min="0.01" step="0.01"')}${s.needAccount?`<div class="field"><label class="label">Account</label><select class="select" data-sheet-account>${store.accounts.filter(a=>!a.archived&&a.type!=='credit').map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></div>`:''}`,button('confirmMoney',s.button||'Confirm','primary full'));
case 'confirm':return sheetFrame(s.title,`<p class="section-sub">${esc(s.text)}</p>`,`<div class="btn-row">${button('closeSheet','Cancel','secondary two')}${button('confirmAction',s.confirmLabel||'Continue',s.danger?'danger two':'primary two')}</div>`);
case 'shareDebt':return sheetFrame('Review reminder',`<p class="hint">This message will not send automatically.</p><textarea class="textarea" data-bind-sheet="shareMessage" style="min-height:143px">${esc(ui.sheetForm.shareMessage||'')}</textarea>`,button('shareReminder','Copy / share draft','primary full'));
case 'restore':{const v=ui.restoreData;return sheetFrame('Restore preview',`<div class="card"><div class="receipt-row"><span>Version</span><strong>${esc(v.version)}</strong></div><div class="receipt-row"><span>Accounts</span><strong>${v.accounts.length}</strong></div><div class="receipt-row"><span>Transactions</span><strong>${v.transactions.length}</strong></div><div class="receipt-row"><span>Groups</span><strong>${v.groups?.length||0}</strong></div></div><p class="hint mt16">Replacing your demo data cannot be undone unless you exported another copy. Existing browser records will be overwritten.</p>`,`<div class="btn-row">${button('closeSheet','Cancel','secondary two')}${button('confirmRestore','Replace demo data','danger two')}</div>`);}
case 'quickAction':return sheetFrame('Quick add',`<div class="stack">${[['expense','Expense','tag'],['income','Income','transfer'],['transfer','Transfer','transfer']].map(([type,label,ico])=>`<button class="sheet-option" data-action="addTxWithType" data-value="${type}">${icon(ico)} ${label}</button>`).join('')}<button class="sheet-option" data-action="openPage" data-page="voice">${icon('mic')} Voice phrase</button><button class="sheet-option" data-action="openPage" data-page="smart">${icon('spark')} Smart Add</button></div>`);
}return '';}
function contentForPage(){switch(ui.page){case'home':return dash();case'activity':return activity();case'accounts':return accountsPage();case'accountDetail':return accountDetail();case'accountForm':return accountForm();case'transactionForm':return transactionForm();case'transferForm':return transferForm();case'transactionDetail':return transactionDetail();case'reports':return reports();case'smart':return smartPage();case'gifts':return giftPage();case'giftForm':return giftForm();case'giftDetail':return giftDetail();case'giftImport':return giftImport();case'giftSettings':return giftSettings();case'more':return morePage();case'settings':return settingsPage();case'profile':return profilePage();case'appearance':return appearancePage();case'security':return securityPage();case'notifications':return notificationsPage();case'smartSettings':return smartSettingsPage();case'categories':return categoriesPage();case'navSettings':return navSettingsPage();case'backup':return backupPage();case'export':return exportPage();case'deleted':return deletedPage();case'about':return aboutPage();case'limits':return limitsPage();case'voice':return voicePage();case'plans':return plansPage();case'goalForm':return goalForm();case'goalDetail':return goalDetail();case'budgetForm':return budgetForm();case'groups':return groupsPage();case'groupDetail':return groupDetail();case'groupForm':return groupForm();case'groupExpenseForm':return groupExpenseForm();case'debts':return debtsPage();case'debtForm':return debtForm();case'debtDetail':return debtDetail();case'recurring':return recurringPage();case'recurringForm':return recurringForm();case'recurringDetail':return recurringDetail();case'reminders':return remindersPage();default:return blank('Screen unavailable','Return to the dashboard.','goHome','Open Home');}}
function formFooter(){const label={transactionForm:'Save transaction',accountForm:'Save account',transferForm:'Save transfer',giftForm:'Save gift card',groupForm:'Create group',groupExpenseForm:'Save shared expense',goalForm:'Save goal',budgetForm:'Save budget',debtForm:'Save debt',recurringForm:'Save subscription'}[ui.page]||'Save';return `<div class="form-actions"><div class="pr-save-row"><span>Saved on device</span>${button('saveForm',label,'primary',ui.saving?'disabled':'')}</div></div>`;}
function render(){const form=isForm();let selectedTheme=store.settings.theme==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):store.settings.theme;document.documentElement.dataset.theme=selectedTheme;document.documentElement.style.setProperty('--gutter',store.settings.density==='compact'?'14px':'18px');app.innerHTML=`<div class="app-content ${form?'form-screen':''}">${header()}<div class="viewport ${form?'form-viewport':'with-nav'}" id="viewport">${contentForPage()}</div>${form?formFooter():bottomNav()}<div class="gesture-bar"></div>${renderSheet()}<input type="file" id="restorePicker" accept=".json,application/json" style="display:none" /></div>`;renderToast();}
function actionLink(page){if(['home','activity','accounts','more','groups','plans'].includes(page))tabTo(page);else navTo(page);}
function saveTransaction(){const f=ui.form;const v=minor(f.amountText);if(!Number.isFinite(v)||v<=0){ui.formError='Enter an amount greater than ₹0';render();setTimeout(()=>$('#viewport [data-bind="amountText"]',app)?.focus({preventScroll:true}),0);return;}if(!accountBy(f.accountId)){showToast('Choose an account.');return;}if(f.type==='transfer'){const src=accountBy(f.accountId),dst=accountBy(f.toAccountId);if(!dst||src.id===dst.id){showToast('Choose two different accounts.');return;}if(src.currency!==dst.currency){showToast('Cross-currency transfers need a verified exchange rate.');return;}}
 if(!f.date){showToast('Choose a transaction date.');return;}
 const old=store.transactions.find(t=>t.id===ui.params.id);const oldSnapshot=old?dataClone(old):null;const tx={...old,...f,amount:v,title:(f.title||f.category||(f.type==='transfer'?'Account transfer':'Transaction')).trim(),category:f.type==='transfer'?'Transfer':f.category,date:f.date,createdAt:old?.createdAt||Date.now(),id:old?.id||id(),source:old?.source||f.source||'manual',deleted:false};delete tx.amountText;
 if(old)Object.assign(old,tx);else store.transactions.push(tx);

function calculatedSplit(f,group,total){const people=group.members;if(f.splitMode==='equal')return equalShares(total,people);const vals=people.map(m=>Number(f.shares?.[m]||0));if(vals.some(x=>!Number.isFinite(x)||x<0)){showToast('Split values must be zero or positive.');return null;}if(f.splitMode==='exact'){const cents=vals.map(x=>minor(x));if(cents.reduce((a,b)=>a+b,0)!==total){showToast(`Exact splits must total ${amount(total)}.`);return null;}return Object.fromEntries(people.map((p,i)=>[p,cents[i]]));}const sum=vals.reduce((a,b)=>a+b,0);if(!(sum>0)){showToast('Enter positive percentages or shares.');return null;}if(f.splitMode==='percentage'&&Math.abs(sum-100)>0.001){showToast('Percentages must total 100%.');return null;}const raw=vals.map(x=>total*x/sum);const out=raw.map(Math.floor);let remainder=total-out.reduce((a,b)=>a+b,0);const rank=raw.map((x,i)=>({i,frac:x-out[i]})).sort((a,b)=>b.frac-a.frac);for(let i=0;i<remainder;i++)out[rank[i%rank.length].i]++;return Object.fromEntries(people.map((p,i)=>[p,out[i]]));}

function parseSmart(text){if(!store.settings.smartImport){showToast('Enable Smart message review in Settings first.');return null;}if(!text.trim()){showToast('Paste a financial message first.');return null;}if(/\b(otp|verification code|one.time password|cvv)\b/i.test(text)){showToast('Security-code messages are intentionally ignored.');return null;}const m=text.match(/(?:₹|rs\.?|inr)\s*([\d,]+(?:\.\d{1,2})?)/i)||text.match(/\b([\d,]+(?:\.\d{1,2})?)\s*(?:rupees|rupaye)\b/i);if(!m){showToast('Could not find an INR amount. Please enter a transaction manually.');return null;}const val=minor(m[1].replace(/,/g,''));if(!(val>0)){showToast('Could not read a positive amount.');return null;}
const type=/(credited|received|deposit(?:ed)?|refund)/i.test(text)&&!/(debited|spent|paid|withdrawn)/i.test(text)?'income':'expense';const tail=text.match(/(?:to|at|from|by)\s+([A-Za-z][A-Za-z0-9 &.'-]{2,40})/i);const merchant=(tail?.[1]||'Bank transaction').replace(/\b(on|ref|upi|a\/c|account|dated)\b.*$/i,'').trim();const ref=text.match(/(?:ref(?:erence)?|utr|txn|transaction id)[:\s#-]*([A-Za-z0-9]{7,})/i)?.[1]||'';const suffix=text.match(/(?:xx|\*\*|\*{2,}|ending\s+)(\d{4})/i)?.[1];const account=store.accounts.find(a=>a.cardLast4===suffix)||store.accounts.find(a=>a.type==='bank')||store.accounts[0];if(ref&&(store.candidates.some(c=>c.ref===ref)||store.transactions.some(t=>!t.deleted&&t.ref===ref)||store.ignoredRefs.includes(ref))){showToast('Possible duplicate: reference already exists.');return null;}if(!ref&&(store.candidates.some(c=>c.status==='pending'&&c.amount===val&&c.type===type&&c.accountId===account?.id&&c.title.toLowerCase()===merchant.toLowerCase()&&c.date===iso())||store.transactions.some(t=>!t.deleted&&t.amount===val&&t.type===type&&t.accountId===account?.id&&t.title.toLowerCase()===merchant.toLowerCase()&&t.date===iso()))){showToast('Possible duplicate payment detected. Review existing entries.');return null;}
const candidate={id:id(),title:merchant||'Bank transaction',amount:val,type,accountId:account?.id||'',category:type==='income'?'Other income':'Other expense',date:iso(),ref,source:'Pasted message',status:'pending'};store.candidates.unshift(candidate);persist();return candidate;}

const oldOnAction=onAction;
onAction=function(el){const a=el.dataset.action, v=el.dataset.value;switch(a){
case 'v6AdvanceSplash':ui.page=flow.completed?(flow.lockEnabled?'unlock':'home'):'welcome';render();return;
case 'v6StartOffline':ui.page='setupMode';render();return;
case 'v6ShowCloud':ui.page='setupMode';flow.mode='google-intended';saveFlow();render();showToast('Google sign-in requires the native Android app. Offline setup remains available.');return;
case 'v6GoWelcome':ui.page='welcome';render();return;
case 'v6SelectMode':flow.mode=v;ui.page='profileSetup';saveFlow();render();return;
case 'v6SaveProfile':{const field=$('[data-flow-name]',app);const nm=(field?.value||flow.profileName||'').trim();if(!nm){showToast('Enter a display name');return;}flow.profileName=nm;store.profile.name=nm;persist();saveFlow();ui.page='lockSetup';render();return;}
case 'v6FinishLock':flow.lockEnabled=flow.prefs.lockEnabledDemo!==false;saveFlow();ui.page='biometricSetup';render();return;
case 'v6SkipLock':flow.lockEnabled=false;saveFlow();ui.page='biometricSetup';render();return;
case 'v6FinishSetup':flow.completed=true;saveFlow();ui.page='reviewSetup';render();return;
case 'v6EnterApp':if(!flow.themeSelected){store.settings.theme='dark';flow.themeSelected=true;saveFlow();persist();}tabTo('home');return;

async function encryptedBackupDemo(){const password=$('#v6BackupPass',app)?.value||'';if(password.length<10){showToast('Use a backup password of at least 10 characters');return;}if(!crypto?.subtle){showToast('Encryption requires a secure browser context');return;}try{const encoder=new TextEncoder(),salt=crypto.getRandomValues(new Uint8Array(16)),nonce=crypto.getRandomValues(new Uint8Array(12));const km=await crypto.subtle.importKey('raw',encoder.encode(password),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt']);const clean=v7SanitizeLedger(store);const data=encoder.encode(JSON.stringify(clean));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:nonce},key,data);const b64=v=>btoa(String.fromCharCode(...new Uint8Array(v)));const file=JSON.stringify({format:'traxos-demo-encrypted-backup',schema:1,algorithm:'PBKDF2-SHA256+AES-256-GCM',iterations:310000,salt:b64(salt),nonce:b64(nonce),ciphertext:b64(ct)});downloadFile(file,`traxos-demo-${iso()}.traxosbackup`,'application/json');flow.lastBackup=new Date().toLocaleString('en-IN');saveFlow();render();showToast('Encrypted prototype archive downloaded');}catch(e){showToast('Could not create encrypted backup');}}
async function restoreEncryptedDemo(){const file=$('#v6EncryptedPicker',app)?.files?.[0],pw=$('#v6RestorePass',app)?.value;if(!file){showToast('Select an encrypted archive');return;}if(!pw){showToast('Enter the archive password');return;}try{const j=JSON.parse(await file.text());if(j.format!=='traxos-demo-encrypted-backup'||j.schema!==1){showToast('This is not a V6 demo archive');return;}const dec=new TextDecoder(),enc=new TextEncoder(),bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(j.salt),iterations:j.iterations,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(j.nonce)},key,bytes(j.ciphertext));const data=JSON.parse(dec.decode(raw));if(data.version!==3||!Array.isArray(data.transactions)||!Array.isArray(data.accounts))throw Error('Invalid schema');ui.restoreData=data;ui.sheet={kind:'restore'};render();}catch(e){showToast('Wrong password, invalid archive or corrupted backup');}}
const avatarInput=document.createElement('input');avatarInput.type='file';avatarInput.id='v6AvatarPicker';avatarInput.accept='image/png,image/jpeg,image/webp';avatarInput.hidden=true;document.body.appendChild(avatarInput);avatarInput.addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;if(file.size>10*1024*1024){showToast('Choose an image under 10 MB');return;}try{const bitmap=await createImageBitmap(file),cn=document.createElement('canvas'),side=144;cn.width=side;cn.height=side;const ctx=cn.getContext('2d'),ratio=Math.max(side/bitmap.width,side/bitmap.height),w=bitmap.width*ratio,h=bitmap.height*ratio;ctx.drawImage(bitmap,(side-w)/2,(side-h)/2,w,h);flow.photo=cn.toDataURL('image/jpeg',.75);saveFlow();render();showToast('Profile photo updated');}catch{showToast('Unable to read this image');}e.target.value='';});

async function v8StartMic(){

  if(v8Voice.blobUrl){URL.revokeObjectURL(v8Voice.blobUrl);v8Voice.blobUrl=null;}
  v8Voice.status='requesting';v8Voice.message='Requesting microphone access…';v8Voice.stopRequested=false;

    v8Voice.status='unavailable';v8Voice.message='Microphone capture is unavailable in this browser. Enter your spoken phrase as text below.';render();return;

  }catch(err){v8Voice.stream?.getTracks().forEach(t=>t.stop());v8Voice.stream=null;v8Voice.status='unavailable';v8Voice.message='Microphone permission was denied or unavailable. Enter a phrase below instead.';if(ui.page==='voice')render();}
}

  v8WasLong=false;v8Pressing=true;clearTimeout(v8HoldTimer);
  v8HoldTimer=setTimeout(()=>{if(!v8Pressing)return;v8WasLong=true;v8StartMic();},520);
});
const v8PointerEnd=()=>{if(!v8Pressing)return;v8Pressing=false;clearTimeout(v8HoldTimer);if(v8WasLong)v8StopMic();};
document.addEventListener('pointerup',v8PointerEnd);
document.addEventListener('pointercancel',v8PointerEnd);
app.addEventListener('contextmenu',e=>{if(e.target.closest('[data-long-press="voice"]'))e.preventDefault();});
app.addEventListener('click',e=>{if(v8WasLong&&e.target.closest('[data-long-press="voice"]')){e.preventDefault();e.stopImmediatePropagation();v8WasLong=false;}},true);

const v8PrevOnAction=onAction;
onAction=function(el){const a=el.dataset.action;switch(a){
  case 'v8Mode':v8SelectWorkspace(el.dataset.value);return;
  case 'v8Chooser':ui.page='demoChoice';ui.history=[];ui.menu=false;render();return;
  case 'v8Onboarding':flow.completed=false;flow.lockEnabled=false;ui.page='welcome';render();return;
  case 'v8MicStart':v8StartMic();return;
  case 'v8MicStop':v8StopMic();return;
}
v8PrevOnAction(el);
};

// QR/barcode decoding and offline image storage are separate from receipt OCR.
// Browser demo uses IndexedDB when permitted. The native APK must encrypt the
// app-private files; never copy them to the card vault or to cloud without consent.
newPages.mediaTools='QR & images';
const v8PhotoMemory={sample:[],empty:[]};
let v8PhotoLoadStatus='';
let v8QrResult='';
const v8OpenDB=()=>new Promise((resolve,reject)=>{
  try{const req=indexedDB.open('traxos_v8_demo_images',1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('photos'))db.createObjectStore('photos',{keyPath:'id'});};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);}
  catch(e){reject(e);}
});
async function v8ListPhotos(){
  try{const db=await v8OpenDB();const tx=db.transaction('photos','readonly'),request=tx.objectStore('photos').getAll();
    const rows=await new Promise((resolve,reject)=>{request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error);});
    db.close();v8PhotoMemory[v8Mode||'sample']=rows.filter(p=>p.mode===(v8Mode||'sample'));
  }catch{v8PhotoLoadStatus='Browser storage is restricted. Images can be previewed during this session only.';}
  if(ui.page==='mediaTools')render();
}
const v8ImagesView=()=>{
  const photos=v8PhotoMemory[v8Mode||'sample'];
  return `<div class="pr-internal"><div class="pr-intro"><h2>QR & images</h2><p>Scan barcodes and keep images on the device. OCR is intentionally not part of Traxos.</p></div>
  <section class="v8-media-panel"><h3>QR / barcode</h3><p>Choose an image containing a QR code or barcode. When your browser supports BarcodeDetector, Traxos reads the code value without uploading the image.</p><input class="v8-media-file" type="file" accept="image/*" id="v8QrInput" capture="environment"><div class="v8-media-output" role="status">${esc(v8QrResult||'No code scanned yet')}</div></section>
  <section class="v8-media-panel"><h3>Saved images</h3><p>Keep a local demo copy of a transaction photo, bill or other image. No text extraction takes place. Native Kotlin will encrypt stored attachments.</p><input class="v8-media-file" type="file" accept="image/*" id="v8PhotoInput"/><div class="v8-media-output" role="status">${esc(v8PhotoLoadStatus||`${photos.length} image${photos.length===1?'':'s'} saved in ${v8Mode==='empty'?'empty':'sample'} workspace`)}</div>
  ${photos.length?`<div class="v8-media-preview">${photos.map(p=>`<article><img src="${p.data}" alt="${esc(p.name)}"/><div><span>${esc(p.name)}</span><button data-action="v8DeleteImage" data-id="${esc(p.id)}">Remove</button></div></article>`).join('')}</div>`:''}</section>
  <p class="pr-footnote">Do not use real sensitive receipts in a browser demo. The production app must store images in encrypted app-private storage, include non-card attachments in opted-in backups as appropriate, and exclude the card vault completely.</p></div>`;
};
const v8MediaPrevContent=contentForPage;
contentForPage=function(){if(ui.page==='mediaTools')return v8ImagesView();return v8MediaPrevContent();};
const v8MediaPrevSmartSettings=v6SmartSettings;
v6SmartSettings=function(){return v8MediaPrevSmartSettings().replace('</div></div>', '</div></div>')+`<section class="v6-block"><div class="v6-label">QR & SAVED IMAGES</div><div class="v6-panel">${lines([['QR scanner & attachments','Decode barcodes and save pictures','mediaTools']])}</div></section>`;};
const v8MediaPrevMore=morePage;
morePage=function(){return v8MediaPrevMore().replace('<div class="pr-intro"><h2>All your tools.</h2>', '<div class="pr-intro"><h2>All your tools.</h2>').replace('</div></div>', '</div></div>')+`<div class="pr-section-head pr-after"><h2>Capture</h2></div><div class="pr-simple-list"><button class="pr-tool-line" data-action="openPage" data-page="mediaTools"><span><strong>QR & images</strong><small>Scanner and locally saved attachments</small></span><span>›</span></button></div>`;};
// Image dimensions are limited to 900 px and JPEG quality 0.7 in this browser demo.
async function v8ResizeImage(file){
  const src=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(file);});
  const img=new Image();img.src=src;await img.decode();const scale=Math.min(1,900/Math.max(img.naturalWidth,img.naturalHeight));
  const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);return canvas.toDataURL('image/jpeg',.7);
}
app.addEventListener('change',async e=>{
  const input=e.target;
  if(input.id==='v8QrInput'){
    const file=input.files?.[0];if(!file)return;
    v8QrResult='Reading barcode image…';if(ui.page==='mediaTools')render();
    try{
      if(typeof BarcodeDetector==='undefined')throw new Error('BarcodeDetector is not available in this browser. The native APK will use an on-device QR scanner.');
      const detector=new BarcodeDetector({formats:['qr_code','code_128','ean_13','ean_8','pdf417','data_matrix','aztec']});
      const bitmap=await createImageBitmap(file);const result=await detector.detect(bitmap);bitmap.close?.();
      v8QrResult=result.length?`Detected: ${result[0].rawValue}`:'No supported QR or barcode found in the image.';
    }catch(err){v8QrResult=err.message||'Unable to scan. Native Android scanner remains in the build.';}
    if(ui.page==='mediaTools')render();
  }
  if(input.id==='v8PhotoInput'){
    const file=input.files?.[0];if(!file)return;
    if(!file.type.startsWith('image/')){v8PhotoLoadStatus='Please choose an image file.';render();return;}
    try{const data=await v8ResizeImage(file);const row={id:`${Date.now()}_${Math.random().toString(36).slice(2)}`,mode:v8Mode||'sample',name:file.name.slice(0,70),data};
      v8PhotoMemory[row.mode].unshift(row);v8PhotoLoadStatus='Saved locally in the demo workspace.';
      try{const db=await v8OpenDB();const tx=db.transaction('photos','readwrite');tx.objectStore('photos').put(row);await new Promise((resolve,reject)=>{tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});db.close();}
      catch{v8PhotoLoadStatus='Preview saved for this session only; browser storage is restricted.';}
    }catch{v8PhotoLoadStatus='Could not save this image.';}
    if(ui.page==='mediaTools')render();
  }
});
const v8MediaPrevAction=onAction;
onAction=function(el){if(el.dataset.action==='v8DeleteImage'){
  const id=el.dataset.id;const mode=v8Mode||'sample';v8PhotoMemory[mode]=v8PhotoMemory[mode].filter(p=>p.id!==id);
  v8OpenDB().then(db=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').delete(id);tx.oncomplete=()=>db.close();}).catch(()=>{});
  v8PhotoLoadStatus='Image removed from demo workspace.';render();return;
}v8MediaPrevAction(el);};
const v8MediaPrevSelect=v8SelectWorkspace;
v8SelectWorkspace=function(m){v8MediaPrevSelect(m);v8ListPhotos();};
const v8MediaPrevNavTo=navTo;
navTo=function(page,params={}){v8MediaPrevNavTo(page,params);if(page==='mediaTools')v8ListPhotos();};

// Small chrome changes applied below via CSS. Begin at mode selector on every fresh
// open so a previously saved demo PIN cannot trap the user again.
ui.page='splash';ui.history=[];
setTimeout(()=>{if(ui.page==='splash'){ui.page='demoChoice';render();}},700);
render();

})();


</script>
