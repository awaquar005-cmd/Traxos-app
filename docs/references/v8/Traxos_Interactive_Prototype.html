function blank(title,description,action,label,iconName='wallet'){return `<div class="empty"><div class="empty-icon">${icon(iconName,'icon-lg')}</div><h3>${esc(title)}</h3><p>${esc(description)}</p>${action?button(action,label,'primary slim'):''}</div>`;}
function header(){const names={home:'Dashboard',activity:'Transactions',accounts:'Accounts',more:'More',transactionForm:ui.params.id?'Edit transaction':'Add transaction',transactionDetail:'Transaction details',accountForm:ui.params.id?'Edit account':'Add account',accountDetail:'Account details',transferForm:'Transfer money',reports:'Monthly reports',smart:'Smart Add',gifts:'Gift Cards',giftForm:ui.params.id?'Edit gift card':'Add gift card',giftImport:'Smart import',giftDetail:'Gift card',giftSettings:'Gift settings',settings:'Settings',profile:'Profile',appearance:'Appearance',security:'Security',backup:'Backup & restore',export:'Export & import',notifications:'Notifications',categories:'Categories',navSettings:'Bottom navigation',smartSettings:'Smart tracking',voice:'Voice quick add',groups:'Shared groups',groupDetail:'Group details',groupForm:'Create group',groupExpenseForm:'Group expense',plans:'Plans',goalForm:'Savings goal',goalDetail:'Savings goal',budgetForm:'Add budget',debts:'Debts & people',debtForm:'Add debt',debtDetail:'Debt details',recurring:'Subscriptions',recurringForm:'Add recurring',recurringDetail:'Subscription',reminders:'Reminders',about:'About Traxos',welcome:'Welcome',limits:'Native capabilities'};
const root=['home','activity','accounts','more','groups','plans'].includes(ui.page);
return `<header class="topbar"><div class="brand-head"><button class="brand-symbol" aria-label="${root?'Traxos home':'Back'}" data-action="${root?'goHome':'back'}">${root?brand():icon('back','icon-lg')}</button><div class="head-copy"><div class="head-overline">TRAXOS</div><div class="head-title">${names[ui.page]||'Traxos'}</div></div></div><button class="icon-btn" data-action="toggleMenu" aria-label="More options" aria-expanded="${ui.menu}">${icon('more','icon-lg')}</button>${ui.menu?`<div class="menu"><button data-action="openPage" data-page="more">${icon('grid')} All tools</button><button data-action="openPage" data-page="gifts">${icon('gift')} Gift Cards</button><button data-action="openPage" data-page="reports">${icon('chart')} Reports</button><button data-action="openPage" data-page="smart">${icon('spark')} Smart Add</button><button data-action="openPage" data-page="backup">${icon('cloud')} Backup</button><button data-action="openPage" data-page="settings">${icon('setting')} Settings</button></div>`:''}</header>`;}
function isForm(){return ['transactionForm','accountForm','transferForm','giftForm','groupForm','groupExpenseForm','goalForm','budgetForm','debtForm','recurringForm'].includes(ui.page);}
function bottomNav(){const tabs=store.settings.nav || ['home','activity','accounts','more'];const labels={home:'Home',activity:'Activity',accounts:'Accounts',more:'More',groups:'Groups',plans:'Plans'};const ico={home:'home',activity:'activity',accounts:'wallet',more:'grid',groups:'users',plans:'target'};return `<nav class="bottom-nav" aria-label="Main navigation">${tabs.slice(0,2).map(p=>`<button class="nav-item ${ui.page===p?'active':''}" data-action="tab" data-page="${p}">${icon(ico[p])}<span>${labels[p]}</span></button>`).join('')}<button class="nav-add" aria-label="Add transaction" data-action="addTransaction">${icon('plus')}</button>${tabs.slice(2,4).map(p=>`<button class="nav-item ${ui.page===p?'active':''}" data-action="tab" data-page="${p}">${icon(ico[p])}<span>${labels[p]}</span></button>`).join('')}</nav>`;}
function accountIcon(a){return `<span class="account-icon ${a.color|| (a.type==='cash'?'green':'blue')}">${icon(a.type==='credit'?'credit':'wallet')}</span>`;}
function transactionIcon(t){const k=t.type==='income'?'transfer':t.type==='transfer'?'transfer':(t.type==='groupExpense'||t.type==='groupShare')?'users':t.type==='groupSettlement'?'users':t.type==='refund'?'undo':t.type==='lend'||t.type==='borrow'?'users':'tag';return `<span class="icon-tile">${icon(k)}</span>`;}
function signedTransaction(t){if(['income','refund','borrow','repayLend'].includes(t.type) || (t.type==='groupSettlement'&&t.direction==='received'))return '+'+justAmount(t.amount);if(t.type==='transfer')return justAmount(t.amount);return '− '+justAmount(t.amount);}
function txItem(t){const x=accountBy(t.accountId);return `<button class="trans-row" data-action="transactionDetail" data-id="${esc(t.id)}">${transactionIcon(t)}<div class="grow"><div class="merchant ellipsis">${esc(t.title||t.category||titleCase(t.type))}</div><div class="meta ellipsis">${esc(x?.name||'No account')} · ${esc(t.category||titleCase(t.type))}</div><div class="trans-detail-line">${dateLocal(t.date)} · ${titleCase(t.type.replace(/([A-Z])/g,' $1'))}</div></div><div class="amount ${['income','refund','repayLend'].includes(t.type)?'text-teal':''}">${signedTransaction(t)}</div></button>`;}
function dash(){const st=monthStats();const bals=balancesByCurrency();const bal=bals.INR||0;const accounts=store.accounts.filter(a=>!a.archived);const recents=store.transactions.filter(t=>!t.deleted).slice().sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt-a.createdAt).slice(0,4);const pending=candidatesPending().length;const goals=store.goals.slice(0,1);
return `<div class="balance-card"><div class="balance-top"><div class="upper">Total balance</div><div class="balance-ornaments"><span class="ornament"></span><span class="ornament"></span><button class="ornament eye" data-action="toggleBalance" aria-label="Toggle amount visibility">${icon(ui.hiddenAmounts?'eyeOff':'eye')}</button></div></div><div class="balance-number">${ui.hiddenAmounts?'••••••':amount(bal)}</div><div class="balance-details"><span>${accounts.length} recorded account${accounts.length===1?'':'s'} ${Object.keys(bals).length>1?'· INR subtotal':''}</span><span>On this phone only · Not backed up</span></div><div style="margin-top:14px"><button class="month-pill" data-action="openPage" data-page="reports">${monthName(currentMonth())}</button></div></div>
<button class="search-link" data-action="openActivitySearch">${icon('search')}<span class="grow">Search your transactions</span>${icon('arrow')}</button>
${pending?`<div class="banner mt8">${icon('spark')}<span class="grow"><strong>${pending} smart suggestion${pending===1?'':'s'}</strong> ready for review</span><button data-action="openPage" data-page="smart">Review</button></div>`:''}
<div class="section-kicker">This month</div><div class="stat-grid"><div class="stat"><div class="stat-label">${icon('back','icon-sm')} Inflow</div><div class="stat-value">${ui.hiddenAmounts?'••••':amount(st.income)}</div></div><div class="stat"><div class="stat-label">${icon('arrow','icon-sm')} Net outflow</div><div class="stat-value">${ui.hiddenAmounts?'••••':amount(st.spend)}</div></div></div>
${section(`${icon('wallet','icon-sm')} Active accounts`,`<span class="small muted">${accounts.length}</span> <button class="section-link" data-action="tab" data-page="accounts">Manage</button>`)}
<div class="account-rail">${accounts.map(a=>`<button class="account-tile" data-action="accountDetail" data-id="${a.id}"><div class="row between">${accountIcon(a)}<span class="tiny muted">${a.currency}</span></div><div class="name ellipsis">${esc(a.name)}</div><div class="money">${ui.hiddenAmounts?'••••':amount(a.type==='credit'?Math.abs(Math.min(amountForAccount(a.id),0)):amountForAccount(a.id),a.currency)}</div><div class="type">${a.type==='credit'?'Credit card · Debt included':titleCase(a.type)+' account'}</div></button>`).join('')}${accounts.length===0?`<button class="account-tile" data-action="addAccount">${icon('plus')} Add an account</button>`:''}</div>
${section('Recent activity',`<button class="section-link" data-action="tab" data-page="activity">View all</button>`)}${recents.length?recents.map(txItem).join(''):blank('Nothing recorded yet','Add your first transaction to start tracking.','addTransaction','Add transaction','activity')}
${goals.length?`<div class="section-kicker">Your savings</div>${goals.map(g=>`<button class="card clickable w100" data-action="goalDetail" data-id="${g.id}" style="border:0;text-align:left;color:var(--text)"><div class="row between"><strong>${esc(g.name)}</strong><span class="muted small">${Math.min(100,Math.round(g.saved/g.target*100)||0)}%</span></div><div class="progress-track mt16"><div class="progress-fill" style="width:${Math.min(100,g.saved/g.target*100||0)}%"></div></div><div class="hint mt8">${amount(g.saved)} of ${amount(g.target)}</div></button>`).join('')}`:''}`;}
function activity(){const types=['All','Expenses','Income','Transfers','Card payments'];let items=store.transactions.filter(x=>!x.deleted);const q=ui.search.toLowerCase().trim();if(q)items=items.filter(t=>[t.title,t.category,t.note,accountName(t.accountId)].join(' ').toLowerCase().includes(q));if(ui.activityAccount!=='all')items=items.filter(t=>t.accountId===ui.activityAccount||t.toAccountId===ui.activityAccount);
if(ui.activityType!=='All')items=items.filter(t=>ui.activityType==='Expenses'?['expense','groupExpense','groupShare'].includes(t.type):ui.activityType==='Income'?['income','refund'].includes(t.type):ui.activityType==='Transfers'?t.type==='transfer':(t.type==='transfer'&&accountBy(t.toAccountId)?.type==='credit'));items.sort((a,b)=>(ui.activitySort==='Oldest first'?1:-1)*(a.date.localeCompare(b.date)||(a.createdAt-b.createdAt)));
return `<div class="header-row"><h2>Activity</h2><div class="pill-actions"><button class="icon-pill" data-action="openPage" data-page="smart">SMS · ${candidatesPending().length}</button><button class="icon-pill" data-action="sheetFilters">Filters ${icon('down','icon-sm')}</button><button class="icon-pill" data-action="sheetSort">${esc(ui.activitySort)} ${icon('down','icon-sm')}</button></div></div><label class="search-input-wrap">${icon('search')}<input type="search" id="searchField" data-bind-ui="search" placeholder="Notes, categories or accounts" value="${esc(ui.search)}" /></label><div class="filter-scroller">${types.map(t=>`<button class="chip ${ui.activityType===t?'active':''}" data-action="activityType" data-value="${t}">${t}</button>`).join('')}</div><div class="row between mb12"><span class="hint">${items.length} transaction${items.length===1?'':'s'}</span><button class="section-link" data-action="openPage" data-page="reports">Monthly reports ${icon('arrow','icon-sm')}</button></div>${items.length?items.map(txItem).join(''):blank(q||ui.activityType!=='All'?'No matching transactions':'Your activity starts here',q||ui.activityType!=='All'?'Try different search terms or filters.':'Transactions appear here as soon as you save them.',q||ui.activityType!=='All'?'resetFilters':'addTransaction',q||ui.activityType!=='All'?'Clear filters':'Add transaction','search')}`;}
function accountsPage(){const accounts=store.accounts.filter(a=>!a.archived);const archived=store.accounts.filter(a=>a.archived);return `${section('Your accounts',`<button class="section-link" data-action="addAccount">+ Add account</button>`)}<div class="account-actions"><button class="small-action" data-action="newTransfer">${icon('transfer','icon-sm')} Transfer</button><button class="small-action" data-action="openPage" data-page="recurring">${icon('repeat','icon-sm')} Recurring</button></div><div class="account-list">${accounts.map(a=>`<button class="account-card" data-action="accountDetail" data-id="${a.id}"><div class="account-card-top">${accountIcon(a)}<span class="acc-title ellipsis">${esc(a.name)}</span><span class="acc-currency">${a.currency}</span></div><div class="balance">${a.type==='credit'?`<span class="hint">Credit outstanding</span><br>${amount(Math.max(0,-amountForAccount(a.id)),a.currency)}`:amount(amountForAccount(a.id),a.currency)}</div><div class="row between"><span class="sub">${a.type==='credit'?'Credit card':titleCase(a.type)} · Active</span>${icon('arrow','icon-sm')}</div></button>`).join('')}${accounts.length===0?blank('No active accounts','You can track spending without an account, or create one to manage balances.','addAccount','Create account'):''}</div>${archived.length?`<div class="section-kicker">Archived (${archived.length})</div>${archived.map(a=>`<button class="option-row" data-action="accountDetail" data-id="${a.id}"><span>${esc(a.name)} <span class="hint">· Archived</span></span>${icon('chevron')}</button>`).join('')}`:''}<p class="section-sub mt16">Balances are calculated from recorded activity. Different currencies remain separate.</p>`;}
function accountDetail(){const a=accountBy(ui.params.id);if(!a)return blank('Account not found','The selected account no longer exists.','goAccounts','Back to accounts');const ts=store.transactions.filter(t=>!t.deleted&&(t.accountId===a.id||t.toAccountId===a.id)).slice().sort((x,y)=>y.date.localeCompare(x.date));const bal=amountForAccount(a.id);
return `<div class="card"><div class="row between">${accountIcon(a)}<span class="tag">${esc(a.currency)}</span></div><h2 style="font-size:21px;margin:15px 0 6px">${esc(a.name)}</h2><div class="large-value">${amount(a.type==='credit'?Math.max(0,-bal):bal,a.currency)}</div><div class="hint mt8">${a.type==='credit'?'Current recorded outstanding':'Calculated account balance'} · ${a.archived?'Archived':'Active'}</div>${a.type==='credit'?`<div class="divider"></div><div class="row between"><span class="mini-stat">Card ending</span><strong class="small">•••• ${esc(a.cardLast4||'Not set')}</strong></div>${a.cardLimit?`<div class="row between mt8"><span class="mini-stat">Available credit (estimate)</span><strong class="small">${amount(a.cardLimit-Math.max(0,-bal))}</strong></div>`:''}<div class="hint mt8">Closing day ${a.closingDay||'—'} · Due day ${a.dueDay||'—'} (user-entered)</div>`:''}</div><div class="btn-row mt16">${button('editAccount',`${icon('edit','icon-sm')} Edit`,'secondary two',`data-id="${a.id}"`)}${button(a.type==='credit'?'payCard':'newTransfer',a.type==='credit'?`${icon('credit','icon-sm')} Pay card`:`${icon('transfer','icon-sm')} Transfer`,'primary two',`data-id="${a.id}"`)}</div>${section('Account activity',`<span class="small muted">${ts.length} records</span>`)}${ts.length?ts.map(txItem).join(''):blank('No account activity','Create an entry using this account.','addTransaction','Add transaction','activity')}`;}
function fmtField(label,name,type='text',value='',extra=''){return `<div class="field"><label class="label" for="f-${name}">${label}</label><input class="input" id="f-${name}" data-bind="${name}" type="${type}" value="${esc(value)}" ${extra}/></div>`;}
function selectHTML(label,name,options,value){return `<div class="field"><label class="label" for="f-${name}">${label}</label><select class="select" id="f-${name}" data-bind="${name}">${options.map(([v,l])=>`<option value="${esc(v)}" ${String(value)===String(v)?'selected':''}>${esc(l)}</option>`).join('')}</select></div>`;}
function formSelector(label,value,action){return `<button class="form-select-row" data-action="${action}"><span class="left">${esc(label)}</span><span class="value">${esc(value)}</span>${icon('chevron','icon-sm')}</button>`;}
function initTransaction(){const t=store.transactions.find(t=>t.id===ui.params.id);if(t){ui.form={...t,amountText:(t.amount/100).toFixed(2)};}else{ui.form={type:ui.params.type||'expense',amountText:'',accountId:ui.params.accountId||store.settings.defaultAccount||store.accounts[0]?.id||'',toAccountId:'',category:ui.params.category||'Bills',title:'',note:'',date:iso(),source:'manual'};}}
function transactionForm(){if(!('amountText' in ui.form))initTransaction();const f=ui.form;const isTransfer=f.type==='transfer';const isRefund=f.type==='refund';const choices=['expense','income','transfer'];return `<div class="segmented mb12">${choices.map(type=>`<button class="segment ${f.type===type||(isRefund&&type==='expense')?'active':''}" data-action="chooseTxType" data-value="${type}">${titleCase(type)}</button>`).join('')}</div><div class="form-box mb12"><div class="row between mb12"><span class="upper">Amount</span><span class="upper">${esc(accountBy(f.accountId)?.currency||'INR')}</span></div><input class="input big" data-bind="amountText" inputmode="decimal" placeholder="0.00" aria-label="Amount" value="${esc(f.amountText)}" /><div class="hint mt8">Enter the amount, then save in one tap.</div></div><div class="stack mb12">${formSelector('Account',accountName(f.accountId),'sheetAccount')}${isTransfer?formSelector('To account',accountName(f.toAccountId),'sheetToAccount'):formSelector('Category',f.category||'Choose category','sheetCategory')}</div>${!isTransfer?`<div class="sub-nav">${f.type==='refund'?`<button data-action="chooseTxType" data-value="expense">Switch to expense</button>`:`<button data-action="chooseTxType" data-value="refund">Record refund</button>`}</div>`:''}<div class="field"><label class="label">Transaction date</label><input class="input" type="date" data-bind="date" value="${esc(f.date)}"/></div><button class="btn ghost slim" data-action="toggleDetails">${icon('edit','icon-sm')} ${ui.moreDetails?'Hide details':'More details'} ${icon('down','icon-sm')}</button>${ui.moreDetails?`<div class="form-box mt8">${fmtField('Merchant / title','title','text',f.title,'placeholder="e.g. Grocery Mart"') }<div class="field"><label class="label" for="f-note">Notes</label><textarea id="f-note" class="textarea" data-bind="note" placeholder="Optional note">${esc(f.note)}</textarea></div></div>`:''}<div class="callout">${isTransfer?'Transfers move money between your accounts, not into income or spending.':f.type==='expense'&&accountBy(f.accountId)?.type==='credit'?'A credit-card purchase increases the card liability. Paying the statement later is not another expense.':'Everything saves locally in this browser prototype; no cloud account is connected.'}</div>`;}
function accountForm(){const a=store.accounts.find(x=>x.id===ui.params.id);if(!('name' in ui.form)){ui.form=a?{...a,openingText:(Math.abs(a.opening)/100).toFixed(2)}:{name:'',type:'bank',currency:'INR',openingText:'0',cardLast4:'',cardLimitText:'',closingDay:'15',dueDay:'5',archived:false,excludeTotal:false,color:'blue'};}const f=ui.form;return `${fmtField('Account name','name','text',f.name,'placeholder="e.g. SBI savings" required maxlength="80"')}${selectHTML('Account type','type',[['cash','Cash'],['bank','Bank account'],['credit','Credit card'],['wallet','E-wallet'],['other','Other']],f.type)}<div class="input-row">${selectHTML('Currency','currency',[['INR','INR · Indian rupee'],['USD','USD · US dollar'],['EUR','EUR · Euro'],['GBP','GBP · British pound']],f.currency)}${fmtField(f.type==='credit'?'Existing outstanding':'Opening balance','openingText','number',f.openingText,'step="0.01" min="0"')}</div>${f.type==='credit'?`<div class="form-title">Credit card details</div><div class="input-row">${fmtField('Last 4 digits','cardLast4','text',f.cardLast4||'','maxlength="4" inputmode="numeric" placeholder="Optional"')}${fmtField('Credit limit','cardLimitText','number',f.cardLimitText||'','step="0.01" min="0"')}</div><div class="input-row">${fmtField('Statement closing day','closingDay','number',f.closingDay||'15','min="1" max="31"')}${fmtField('Payment due day','dueDay','number',f.dueDay||'5','min="1" max="31"')}</div><p class="hint">These dates are entered by you, not verified with the bank. Full card numbers and CVVs are never requested.</p>`:''}${selectHTML('Account color','color',[['blue','Blue'],['green','Mint'],['amber','Amber'],['violet','Violet']],f.color||'blue')}<div class="form-title">Visibility</div><div class="card"><div class="toggle-row"><span class="toggle-label">Archive account</span><button class="switch ${f.archived?'on':''}" data-action="formToggle" data-field="archived" aria-label="Archive account"></button></div><div class="toggle-row"><span class="toggle-label">Exclude from Home total</span><button class="switch ${f.excludeTotal?'on':''}" data-action="formToggle" data-field="excludeTotal" aria-label="Exclude from Home total"></button></div></div><p class="hint mt16">Archiving preserves transactions. Changing opening balances is a demo adjustment and should be audited in a production ledger.</p>`;}
function transferForm(){if(!('amountText' in ui.form))ui.form={accountId:ui.params.accountId||store.accounts.find(a=>a.type!=='credit')?.id||'',toAccountId:ui.params.toAccountId||store.accounts.find(a=>a.type==='credit')?.id||'',amountText:'',date:iso(),note:'',title:ui.params.card?'Credit card payment':'Account transfer'};const f=ui.form;return `<div class="form-box mb12"><label class="upper">Transfer amount</label><input class="input big mt8" data-bind="amountText" inputmode="decimal" placeholder="0.00" value="${esc(f.amountText)}" /></div><div class="stack mb12">${formSelector('From',accountName(f.accountId),'sheetAccount')}${formSelector('To',accountName(f.toAccountId),'sheetToAccount')}</div>${fmtField('Date','date','date',f.date)}${fmtField('Note','note','text',f.note,'placeholder="Optional transfer note"')}<div class="banner">${icon('info')} <span>Internal transfers and card repayments are not counted as new expenses.</span></div>`;}
function reports(){const key=currentMonth();const st=monthStats(key);const all=store.transactions.filter(t=>!t.deleted&&monthKey(t.date)===key);const entries=ui.reportTab==='Spending'?Object.entries(st.categories).filter(([,v])=>v>0):Object.entries(all.filter(t=>t.type==='income').reduce((obj,t)=>(obj[t.category||'Other income']=(obj[t.category||'Other income']||0)+t.amount,obj),{}));const total=entries.reduce((n,[,v])=>n+v,0);entries.sort((a,b)=>b[1]-a[1]);return `<div class="month-switch"><button data-action="monthBack" aria-label="Previous month">${icon('back')}</button><span>${monthName(key)}</span><button data-action="monthNext" aria-label="Next month">${icon('arrow')}</button></div><div class="segmented mb12"><button class="segment ${ui.reportTab==='Spending'?'active':''}" data-action="reportTab" data-value="Spending">Spending</button><button class="segment ${ui.reportTab==='Income'?'active':''}" data-action="reportTab" data-value="Income">Income</button></div><div class="stat-grid mb12"><div class="stat"><div class="stat-label">Income</div><div class="stat-value">${amount(st.income)}</div></div><div class="stat"><div class="stat-label">Net spending</div><div class="stat-value">${amount(st.spend)}</div></div></div><p class="hint">Calendar month · refunds reduce spending. Transfers, card repayments, savings allocations and debt principal are excluded.</p>${section(ui.reportTab==='Spending'?'Where it went':'Income sources')}${entries.length?`<div class="card">${entries.map(([cat,n])=>`<button class="option-row" data-action="reportCategory" data-category="${esc(cat)}"><div class="grow"><div class="row-metric"><span>${esc(cat)}</span><strong>${amount(n)}</strong></div><div class="progress-track"><div class="progress-fill" style="width:${Math.max(1,Math.min(100,100*n/total))}%"></div></div></div>${icon('chevron','icon-sm')}</button>`).join('')}</div>`:blank('No entries this month','Once you record transactions, the monthly category breakdown appears here.','addTran function smartPage(){const items=store.candidates.filter(c=>c.status==='pending');return `<div class="header-row"><h2>Review inbox</h2><span class="tag ${items.length?'amber':''}">${items.length} pending</span></div><div class="banner mb12">${icon('shield')}<span>Suggestions are processed from text you paste here. Nothing becomes a transaction until you approve it.</span></div><div class="field"><label class="label">Paste a bank/UPI message</label><textarea id="smartText" class="textarea" data-bind-ui="smartText" placeholder="Example: INR 249 debited from account XX1259 to Grocery Mart on 12 Nov..."></textarea></div><div class="btn-row mb12">${button('pasteSmart',`${icon('file','icon-sm')} Paste`,'secondary two')}${button('detectSmart',`${icon('spark','icon-sm')} Find suggestion`,'primary two')}</div>${section('Waiting for approval')}${items.length?items.map(c=>`<div class="card mb12"><div class="row between"><span class="tag">${esc(c.source||'Smart suggestion')}</span><span class="tag amber">Pending</span></div><h3 class="ellipsis" style="font-size:16px;margin:12px 0 6px">${esc(c.title)}</h3><div class="large-value">${c.type==='income'?'+':'−'} ${justAmount(c.amount)}</div><div class="hint mt8">${dateLocal(c.date)} · ${esc(accountName(c.accountId))}</div>${c.ref?`<div class="hint mt8">Reference: ${esc(c.ref)}</div>`:''}<p class="hint mt8">Review the account, category and amount before recording.</p><div class="btn-row mt16">${button('approveCandidate','Approve','primary two',`data-id="${c.id}"`)}${button('editCandidate','Edit','secondary two',`data-id="${c.id}"`)}${button('rejectCandidate','Ignore','ghost two',`data-id="${c.id}"`)}</div></div>`).join(''):blank('All caught up','No messages are waiting for review.','pasteSmart','Paste a message','checkCircle')}<p class="hint mt16">Real automatic SMS capture, background notifications and native permissions require the Kotlin Android app. This web prototype tests the review experience.</p>`;}

function goalDetail(){const g=store.goals.find(x=>x.id===ui.params.id);if(!g)return '';const percent=Math.min(100,Math.round(g.saved/g.target*100)||0);return `<div class="card"><div class="row between"><h2>${esc(g.name)}</h2><span class="tag teal">${percent}%</span></div><div class="large-value">${amount(g.saved)}</div><p class="hint">of ${amount(g.target)} target ${g.deadline?'· by '+dateLocal(g.deadline):''}</p><div class="progress-track mt16"><div class="progress-fill" style="width:${percent}%"></div></div></div><div class="btn-row mt16">${button('allocateGoal','Add savings','primary two',`data-id="${g.id}"`)}${button('withdrawGoal','Withdraw allocation','secondary two',`data-id="${g.id}"`)}</div><div class="callout">These are virtual savings allocations, not bank transfers. Use Accounts → Transfer to move actual funds.</div>${button('editGoal','Edit goal','ghost full mt8',`data-id="${g.id}"`)}`;}
function budgetForm(){const b=store.budgets.find(x=>x.id===ui.params.id);if(!('category' in ui.form))ui.form=b?{...b,limitText:(b.limit/100).toFixed(2)}:{category:'All spending',limitText:'',month:currentMonth()};const f=ui.form;return `${selectHTML('Budget for','category',[['All spending','All spending'],...store.categories.expense.map(x=>[x,x])],f.category)}${fmtField('Monthly limit','limitText','number',f.limitText,'min="0.01" step="0.01"')}${fmtField('Month','month','month',f.month)}<div class="hint">Budgets help you plan; they do not create or move money.</div>`;}
function groupsPage(){return `<div class="header-row"><h2>Your shared spaces</h2>${button('addGroup','+ New group','primary slim')}</div><div class="banner mb12">${icon('cloud')}<span>Group changes are local examples only. No invitations are sent or shared with other people.</span></div>${store.groups.length?store.groups.map(g=>{const exp=store.groupExpenses.filter(x=>x.groupId===g.id);const balance=groupNet(g)['You']||0;return `<button class="card clickable w100 mb12" data-action="groupDetail" data-id="${g.id}" style="border:0;text-align:left;color:var(--text)"><div class="row between"><span class="row">${icon('users')} <strong>${esc(g.name)}</strong></span>${icon('arrow')}</div><div class="hint mt8">${g.members.length} members · ${exp.length} shared expenses</div><div class="large-value mt16 ${balance>=0?'text-teal':'text-red'}">${balance>0?'Owed ':balance<0?'Owe ':'Settled · '}${amount(Math.abs(balance))}</div></button>`;}).join(''):blank('Split expenses simply','Create a group, add people and split bills equally or by custom amounts.','addGroup','Create group','users')}`;}
function groupNet(g){const result={};if(!g)return result;g.members.forEach(x=>result[x]=0);for(const e of store.groupExpenses.filter(e=>e.groupId===g.id)){result[e.paidBy]=(result[e.paidBy]||0)+e.amount;for(const [member,share] of Object.entries(e.shares||{}))result[member]=(result[member]||0)-share;}for(const s of store.groupSettlements.filter(s=>s.groupId===g.id)){result[s.from]=(result[s.from]||0)+s.amount;result[s.to]=(result[s.to]||0)-s.amount;}return result;}
function groupDetail(){const g=store.groups.find(x=>x.id===ui.params.id);if(!g)return '';const net=groupNet(g);const items=store.groupExpenses.filter(e=>e.groupId===g.id);return `<div class="card"><div class="row between"><div><h2 style="margin:0 0 4px">${esc(g.name)}</h2><span class="hint">${g.members.length} members · Local-only preview</span></div>${icon('users','icon-lg')}</div><div class="divider"></div><div class="row between"><span class="muted small">Your group balance</span><span class="large-value ${net.You>=0?'text-teal':'text-red'}">${amount(net.You||0)}</span></div></div><div class="btn-row mt16">${button('addGroupExpense','+ Add expense','primary two',`data-id="${g.id}"`)}${button('settleGroup','Settle','secondary two',`data-id="${g.id}"`)}</div>${section('Members')}<div class="settings-group">${g.members.map(m=>`<div class="option-row"><span>${esc(m)} ${m==='You'?'<span class="tag">You</span>':''}</span><strong class="${(net[m]||0)>=0?'text-teal':'text-red'}">${amount(net[m]||0)}</strong></div>`).join('')}</div>${section('Shared expenses')}${items.length?items.slice().reverse().map(e=>`<div class="card mb12"><div class="row between"><strong>${esc(e.title)}</strong><strong>${amount(e.amount)}</strong></div><div class="hint mt8">Paid by ${esc(e.paidBy)} · ${dateLocal(e.date)}</div><div class="hint mt8">Your share ${amount(e.shares.You||0)} · ${esc(e.splitMode)}</div></div>`).join(''):blank('No group expenses','Record the first shared bill.','addGroupExpense','Add group expense','users')}`;}
function groupForm(){if(!('name' in ui.form))ui.form={name:'',members:'Aman, Priya'};return `${fmtField('Group name','name','text',ui.form.name,'placeholder="e.g. Weekend trip"')}${fmtField('Members (comma-separated)','members','text',ui.form.members,'placeholder="Aman, Priya, Kiran"')}<p class="hint">You are automatically included. Invite delivery and server-based group permissions are not part of the HTML demo.</p>`;}
function equalShares(total,members){const q=Math.floor(total/members.length),rem=total%members.length;return Object.fromEntries(members.map((m,i)=>[m,q+(i<rem?1:0)]));}
function groupExpenseForm(){const g=store.groups.find(x=>x.id===ui.params.id);if(!g)return '';if(!('amountText' in ui.form))ui.form={title:'',amountText:'',paidBy:'You',accountId:store.settings.defaultAccount||'bank',splitMode:'equal',date:iso(),shares:{}};const f=ui.form;if(!f.shares)f.shares={};return `${fmtField('What was the expense?','title','text',f.title,'placeholder="e.g. Dinner"')}${fmtField('Total amount','amountText','number',f.amountText,'min="0.01" step="0.01"')}${selectHTML('Paid by','paidBy',g.members.map(m=>[m,m]),f.paidBy)}${f.paidBy==='You'?formSelector('Paid from',accountName(f.accountId),'sheetAccount'):''}${selectHTML('Split method','splitMode',[['equal','Equal'],['exact','Exact amounts'],['percentage','Percentages'],['shares','Shares / weights']],f.splitMode)}${f.splitMode!=='equal'?`<div class="card mb12"><div class="form-title mt0">${f.splitMode==='percentage'?'Percent per person':f.splitMode==='shares'?'Shares per person':'Amount per person'}</div><div class="split-table">${g.members.map(m=>`<div class="split-row"><span>${esc(m)}</span><input type="number" step="0.01" min="0" class="input" data-split-member="${esc(m)}" placeholder="${f.splitMode==='percentage'?'%':f.splitMode==='shares'?'Weight':'₹'}" value="${esc(f.shares[m]??'')}" /></div>`).join('')}</div></div>`:''}${fmtField('Date','date','date',f.date)}<div class="banner">${icon('info')}<span>If you paid, your account decreases by the full payment but only your own share counts as personal spending. The rest is owed back to you.</span></div>`;}
function debtsPage(){return `<div class="header-row"><h2>Debts & people</h2>${button('addDebt','+ Add debt','primary slim')}</div><div class="stat-grid mb12"><div class="stat"><div class="stat-label">Owed to you</div><div class="stat-value">${amount(store.debts.filter(d=>d.kind==='lend').reduce((a,d)=>a+d.amount-d.settled,0))}</div></div><div class="stat"><div class="stat-label">You owe</div><div class="stat-value">${amount(store.debts.filter(d=>d.kind==='borrow').reduce((a,d)=>a+d.amount-d.settled,0))}</div></div></div>${store.debts.length?store.debts.map(d=>`<button class="card clickable w100 mb12" data-action="debtDetail" data-id="${d.id}" style="text-align:left;color:var(--text);border:0"><div class="row between"><strong>${esc(d.person)}</strong><span class="tag ${d.kind==='lend'?'teal':'amber'}">${d.kind==='lend'?'Owes you':'You owe'}</span></div><div class="large-value mt16">${amount(d.amount-d.settled)}</div><div class="hint mt8">${esc(d.reason||'Personal debt')} ${d.dueDate?'· Due '+dateLocal(d.dueDate):''}</div></button>`).join(''):blank('No personal debts','Track money lent or borrowed without counting the principal as income or spending.','addDebt','Add debt','users')}`;}
function debtForm(){if(!('person' in ui.form))ui.form={person:'',kind:'lend',amountText:'',accountId:store.settings.defaultAccount||'bank',reason:'',date:iso(),dueDate:'',phone:''};const f=ui.form;return `<div class="segmented mb12"><button class="segment ${f.kind==='lend'?'active':''}" data-action="debtKind" data-value="lend">Lent money</button><button class="segment ${f.kind==='borrow'?'active':''}" data-action="debtKind" data-value="borrow">Borrowed</button></div>${fmtField('Person','person','text',f.person,'placeholder="e.g. Aman"')}${fmtField('Amount','amountText','number',f.amountText,'min="0.01" step="0.01"')}${formSelector('Cash account',accountName(f.accountId),'sheetAccount')}${fmtField('Reason','reason','text',f.reason,'placeholder="e.g. Shared dinner"')}<div class="input-row">${fmtField('Start date','date','date',f.date)}${fmtField('Due date','dueDate','date',f.dueDate)}</div>${fmtField('Phone (optional)','phone','tel',f.phone,'placeholder="+91…"')}<p class="hint">The demo records an account movement for the principal, separate from income and expense totals.</p>`;}
function debtDetail(){const d=store.debts.find(x=>x.id===ui.params.id);if(!d)return '';const due=d.amount-d.settled;return `<div class="card"><div class="row between"><h2 class="mt0">${esc(d.person)}</h2><span class="tag ${d.kind==='lend'?'teal':'amber'}">${d.kind==='lend'?'Owes you':'You owe'}</span></div><div class="upper">Outstanding</div><div class="large-value mt8">${amount(due)}</div><div class="divider"></div><div class="receipt-row"><span>Original amount</span><strong>${amount(d.amount)}</strong></div><div class="receipt-row"><span>Repaid</span><strong>${amount(d.settled)}</strong></div><div class="receipt-row"><span>Reason</span><strong>${esc(d.reason||'—')}</strong></div><div class="receipt-row"><span>Due date</span><strong>${d.dueDate?dateLocal(d.dueDate):'Not set'}</strong></div></div><div class="btn-row mt16">${button('repayDebt',d.kind==='lend'?'Record received':'Record payment','primary two',`data-id="${d.id}"`)}${button('shareDebt','Draft reminder','secondary two',`data-id="${d.id}"`)}</div>${section('History')}<div class="card"><div class="option-row"><span>${d.kind==='lend'?'You lent money':'You borrowed money'} · ${dateLocal(d.date)}</span><strong>${amount(d.amount)}</strong></div>${(d.payments||[]).map(p=>`<div class="option-row"><span>Repayment · ${dateLocal(p.date)}</span><strong>${amount(p.amount)}</strong></div>`).join('')}</div>`;}
function recurringPage(){const items=store.recurring.slice().sort((a,b)=>a.nextDate.localeCompare(b.nextDate));return `<div class="header-row"><h2>Subscriptions & bills</h2>${button('addRecurring','+ Add','primary slim')}</div><div class="banner mb12">${icon('bell')}<span>Upcoming payments are reminders, not posted expenses. Review and confirm when actually paid.</span></div>${items.length?items.map(r=>`<button class="card clickable w100 mb12" style="text-align:left;border:0;color:var(--text)" data-action="recurringDetail" data-id="${r.id}"><div class="row between"><strong>${esc(r.name)}</strong><span class="tag ${r.status==='active'?'teal':'amber'}">${titleCase(r.status)}</span></div><div class="large-value mt16">${amount(r.amount)}</div><div class="hint mt8">${titleCase(r.frequency)} · Next ${dateLocal(r.nextDate)} · ${esc(accountName(r.accountId))}</div></button>`).join(''):blank('No subscriptions yet','Track streaming, rent and other repeat bills. You decide when to record each payment.','addRecurring','Add subscription','repeat')}`;}
function recurringForm(){const x=store.recurring.find(y=>y.id===ui.params.id);if(!('name' in ui.form))ui.form=x?{...x,amountText:(x.amount/100).toFixed(2)}:{name:'',amountText:'',frequency:'monthly',accountId:store.settings.defaultAccount||'bank',category:'Bills',nextDate:iso(),status:'active',note:''};const f=ui.form;return `${fmtField('Subscription / bill','name','text',f.name,'placeholder="e.g. Spotify"')}${fmtField('Amount','amountText','number',f.amountText,'min="0.01" step="0.01"')}${selectHTML('Repeat','frequency',[['weekly','Weekly'],['monthly','Monthly'],['quarterly','Quarterly'],['yearly','Yearly']],f.frequency)}${fmtField('Next due','nextDate','date',f.nextDate)}${formSelector('Pay from',accountName(f.accountId),'sheetAccount')}${formSelector('Category',f.category||'Bills','sheetCategory')}${selectHTML('Status','status',[['active','Active'],['paused','Paused'],['cancelled','Cancelled']],f.status)}${fmtField('Note','note','text',f.note,'placeholder="Optional"')}<p class="hint">Adding a subscription schedules an expected payment only. No bank charge occurs automatically.</p>`;}
function nextRecurrence(date,frequency){const dt=new Date(`${date}T12:00:00`);if(frequency==='weekly')dt.setDate(dt.getDate()+7);else if(frequency==='quarterly')dt.setMonth(dt.getMonth()+3);else if(frequency==='yearly')dt.setFullYear(dt.getFullYear()+1);else dt.setMonth(dt.getMonth()+1);return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;}
function recurringDetail(){const r=store.recurring.find(x=>x.id===ui.params.id);if(!r)return '';return `<div class="card"><div class="row between"><h2 class="mt0">${esc(r.name)}</h2><span class="tag ${r.status==='active'?'teal':'amber'}">${titleCase(r.status)}</span></div><div class="large-value">${amount(r.amount)}</div><div class="receipt-row"><span>Frequency</span><strong>${titleCase(r.frequency)}</strong></div><div class="receipt-row"><span>Next expected</span><strong>${dateLocal(r.nextDate)}</strong></div><div class="receipt-row"><span>Payment account</span><strong>${esc(accountName(r.accountId))}</strong></div><div class="receipt-row"><span>Category</span><strong>${esc(r.category)}</strong></div></div><div class="btn-row mt16">${button('confirmRecurring','Mark paid & record','primary two',`data-id="${r.id}"`)}${button('editRecurring','Edit rule','secondary two',`data-id="${r.id}"`)}</div><div class="callout">Only choose “Mark paid” when the charge really happened. This demo adds exactly one expense and moves the next expected date forward.</div>`;}
function transactionDetail(){const t=store.transactions.find(x=>x.id===ui.params.id);if(!t)return '';return `<div class="card"><div class="row between">${transactionIcon(t)}<span class="tag">${titleCase(t.type.replace(/([A-Z])/g,' $1'))}</span></div><h2 style="margin:15px 0 5px">${esc(t.title||t.category||'Transaction')}</h2><div class="large-value ${['income','refund'].includes(t.type)?'text-teal':''}">${signedTransaction(t)}</div><div class="divider"></div><div class="receipt-row"><span>Account</span><strong>${esc(accountName(t.accountId))}</strong></div>${t.type==='transfer'?`<div class="receipt-row"><span>To account</span><strong>${esc(accountName(t.toAccountId))}</strong></div>`:''}<div class="receipt-row"><span>Category</span><strong>${esc(t.category||'Not applicable')}</strong></div><div class="receipt-row"><span>Date</span><strong>${dateLocal(t.date)}</strong></div><div class="receipt-row"><span>Source</span><strong>${titleCase(t.source||'manual')}</strong></div>${t.note?`<div class="receipt-row"><span>Note</span><strong>${esc(t.note)}</strong></div>`:''}</div><div class="btn-row mt16">${button('editTransaction',`${icon('edit','icon-sm')} Edit`,'secondary two',`data-id="${t.id}"`)}${button('deleteTransaction',`${icon('trash','icon-sm')} Delete`,'danger two',`data-id="${t.id}"`)}</div>`;}
function sheetFrame(title,body,footer=''){return `<div class="sheet-layer" data-overlay="true"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-handle"></div><div class="sheet-head"><h3>${esc(title)}</h3><button class="icon-btn" data-action="closeSheet" aria-label="Close">${icon('close')}</button></div>${body}${footer?`<div class="sheet-footer">${footer}</div>`:''}</div></div>`;}
function renderSheet(){const s=ui.sheet;if(!s)return '';let options,selected,selAction,title;switch(s.kind){
case 'account':
 options=store.accounts.filter(a=>!a.archived).map(a=>({value:a.id,label:`${a.name} · ${a.currency}`}));selected=ui.form[s.field];selAction='selectAccount';title=s.field==='toAccountId'?'To account':'Account';return sheetFrame(title,`<button class="sheet-option" data-action="addAccount">${icon('plus')} <strong>Add new account</strong></button>${options.map(o=>`<button class="sheet-option" data-action="${selAction}" data-field="${s.field}" data-value="${o.value}"><span class="radio-circle ${selected===o.value?'selected':''}"></span><span>${esc(o.label)}</span></button>`).join('')}`);
case 'category':options=(store.categories[ui.form.type==='income'?'income':'expense']||[]).map(v=>({value:v,label:v}));return sheetFrame('Category',`<button class="sheet-option" data-action="addCategory">${icon('plus')} <strong>Add new category</strong></button>${options.map(o=>`<button class="sheet-option" data-action="selectCategory" data-value="${esc(o.value)}"><span class="radio-circle ${ui.form.category===o.value?'selected':''}"></span>${esc(o.label)}</button>`).join('')}`);
case 'sort':return sheetFrame('Sort transactions',['Newest first','Oldest first'].map(o=>`<button class="sheet-option" data-action="setSort" data-value="${o}"><span class="radio-circle ${ui.activitySort===o?'selected':''}"></span>${o}</button>`).join(''));
case 'filters':return sheetFrame('Filter activity',`<div class="field"><label class="label">Account</label><select class="select" data-filter-account><option value="all">All accounts</option>${store.accounts.map(a=>`<option value="${a.id}" ${ui.activityAccount===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div>`,button('applyFilters','Apply filters','primary full'));
case 'giftFilter':return sheetFrame('Filter gift cards',['All cards','Active','Expiring soon','Redeemed / expired','Archived'].map(v=>`<button class="sheet-option" data-action="selectGiftFilter" data-value="${v}"><span class="radio-circle ${ui.giftFilter===v?'selected':''}"></span>${v}</button>`).join(''));
case 'giftSort':return sheetFrame('Sort gift cards',['Expiry','Name','Balance'].map(v=>`<button class="sheet-option" data-action="selectGiftSort" data-value="${v}"><span class="radio-circle ${ui.giftSort===v?'selected':''}"></span>${v}</button>`).join(''));
case 'addCategory':return sheetFrame('New category',`${fmtField('Category name','categoryName','text',ui.sheetForm.categoryName||'','placeholder="e.g. Fuel"')}${selectHTML('Category type','categoryType',[['expense','Expense'],['income','Income']],ui.sheetForm.categoryType||'expense')}`,button('saveNewCategory','Add category','primary full'));
case 'money':return sheetFrame(s.title,`${s.text?`<p class="hint">${esc(s.text)}</p>`:''}${fmtField('Amount','sheetAmount','number','','min="0.01" step="0.01"')}${s.needAccount?`<div class="field"><label class="label">Account</label><select class="select" data-sheet-account>${store.accounts.filter(a=>!a.archived&&a.type!=='credit').map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></div>`:''}`,button('confirmMoney',s.button||'Confirm','primary full'));
case 'confirm':return sheetFrame(s.title,`<p class="section-sub">${esc(s.text)}</p>`,`<div class="btn-row">${button('closeSheet','Cancel','secondary two')}${button('confirmAction',s.confirmLabel||'Continue',s.danger?'danger two':'primary two')}</div>`);
case 'shareDebt':return sheetFrame('Review reminder',`<p class="hint">This message will not send automatically.</p><textarea class="textarea" data-bind-sheet="shareMessage" style="min-height:143px">${esc(ui.sheetForm.shareMessage||'')}</textarea>`,button('shareReminder','Copy / share draft','primary full'));
case 'restore':{const v=ui.restoreData;return sheetFrame('Restore preview',`<div class="card"><div class="receipt-row"><span>Version</span><strong>${esc(v.version)}</strong></div><div class="receipt-row"><span>Accounts</span><strong>${v.accounts.length}</strong></div><div class="receipt-row"><span>Transactions</span><strong>${v.transactions.length}</strong></div><div class="receipt-row"><span>Groups</span><strong>${v.groups?.length||0}</strong></div></div><p class="hint mt16">Replacing your demo data cannot be undone unless you exported another copy. Existing browser records will be overwritten.</p>`,`<div class="btn-row">${button('closeSheet','Cancel','secondary two')}${button('confirmRestore','Replace demo data','danger two')}</div>`);}
case 'quickAction':return sheetFrame('Quick add',`<div class="stack">${[['expense','Expense','tag'],['income','Income','transfer'],['transfer','Transfer','transfer']].map(([type,label,ico])=>`<button class="sheet-option" data-action="addTxWithType" data-value="${type}">${icon(ico)} ${label}</button>`).join('')}<button class="sheet-option" data-action="openPage" data-page="voice">${icon('mic')} Voice phrase</button><button class="sheet-option" data-action="openPage" data-page="smart">${icon('spark')} Smart Add</button></div>`);
}return '';}

function saveTransaction(){const f=ui.form;const v=minor(f.amountText);if(!Number.isFinite(v)||v<=0){showToast('Amount must be greater than ₹0.');return;}if(!accountBy(f.accountId)){showToast('Choose an account.');return;}if(f.type==='transfer'){const src=accountBy(f.accountId),dst=accountBy(f.toAccountId);if(!dst||src.id===dst.id){showToast('Choose two different accounts.');return;}if(src.currency!==dst.currency){showToast('Cross-currency transfers need a verified exchange rate.');return;}}
 if(!f.date){showToast('Choose a transaction date.');return;}
 const old=store.transactions.find(t=>t.id===ui.params.id);const oldSnapshot=old?dataClone(old):null;const tx={...old,...f,amount:v,title:(f.title||f.category||(f.type==='transfer'?'Account transfer':'Transaction')).trim(),category:f.type==='transfer'?'Transfer':f.category,date:f.date,createdAt:old?.createdAt||Date.now(),id:old?.id||id(),source:old?.source||f.source||'manual',deleted:false};delete tx.amountText;
 if(old)Object.assign(old,tx);else store.transactions.push(tx);
 if(f.fromCandidate){const c=store.candidates.find(c=>c.id===f.fromCandidate);if(c)c.status='approved';}
 persist();tabTo('activity');showToast(old?'Transaction updated':'Transaction saved locally',{label:'Undo',fn:()=>{const t=store.transactions.find(z=>z.id===tx.id);if(t){if(oldSnapshot)Object.assign(t,oldSnapshot);else t.deleted=true;persist();render();}}});}
function saveAccount(){const f=ui.form,name=(f.name||'').trim();if(!name){showToast('Enter an account name.');return;}const current=store.accounts.find(a=>a.id===ui.params.id);const val=minor(f.openingText);if(!Number.isFinite(val)||val<0){showToast('Opening amount must be zero or more.');return;}if(f.cardLast4&&!/^\d{4}$/.test(f.cardLast4)){showToast('Enter exactly four digits for the card suffix.');return;}const a={...current,...f,id:current?.id||id(),name,currency:f.currency,type:f.type,opening:f.type==='credit'?-val:val,created:current?.created||iso(),cardLimit:minor(f.cardLimitText||0),closingDay:Number(f.closingDay||15),dueDay:Number(f.dueDay||5)};delete a.openingText;delete a.cardLimitText;if(current)Object.assign(current,a);else store.accounts.push(a);if(!store.settings.defaultAccount)store.settings.defaultAccount=a.id;persist();tabTo('accounts');showToast('Account saved');}
function saveTransfer(){const f=ui.form,v=minor(f.amountText);const a=accountBy(f.accountId),b=accountBy(f.toAccountId);if(!a||!b||a.id===b.id){showToast('Choose two different accounts.');return;}if(a.currency!==b.currency){showToast('Cross-currency transfers are not available in this prototype.');return;}if(!(v>0)){showToast('Enter an amount greater than zero.');return;}store.transactions.push({id:id(),type:'transfer',title:f.title||`Transfer to ${b.name}`,amount:v,accountId:a.id,toAccountId:b.id,category:'Transfer',date:f.date||iso(),note:f.note||'',source:'manual',createdAt:Date.now()});persist();tabTo('accounts');showToast('Transfer recorded locally',{label:'Undo',fn:()=>{store.transactions.at(-1).deleted=true;persist();render();}});}
function saveGift(){const f=ui.form;const v=minor(f.balanceText);if(!f.merchant?.trim()||!Number.isFinite(v)||v<0){showToast('Enter a merchant and valid remaining value.');return;}const old=store.gifts.find(g=>g.id===ui.params.id);const g={...f,id:old?.id||id(),merchant:f.merchant.trim(),name:f.name.trim()||`${f.merchant.trim()} gift card`,balance:v};delete g.balanceText;if(old)Object.assign(old,g);else store.gifts.push(g);persist();tabTo('more');navTo('gifts');showToast('Gift card saved');}
function saveGoal(){const f=ui.form,amountVal=minor(f.targetText);if(!f.name?.trim()||!(amountVal>0)){showToast('Enter a goal name and target amount.');return;}const old=store.goals.find(g=>g.id===ui.params.id),g={...f,id:old?.id||id(),name:f.name.trim(),target:amountVal,saved:old?.saved||0};delete g.targetText;if(old)Object.assign(old,g);else store.goals.push(g);persist();tabTo('plans');showToast('Savings goal saved');}
function saveBudget(){const f=ui.form,v=minor(f.limitText);if(!(v>0)){showToast('Enter a budget greater than zero.');return;}const current=store.budgets.find(b=>b.id===ui.params.id);const item={id:current?.id||id(),category:f.category,limit:v,month:f.month||currentMonth()};if(current)Object.assign(current,item);else store.budgets.push(item);persist();tabTo('plans');showToast('Budget saved');}
function saveGroup(){const f=ui.form;if(!f.name?.trim()){showToast('Give this group a name.');return;}const names=(f.members||'').split(',').map(x=>x.trim()).filter(Boolean).filter(x=>x.toLowerCase()!=='you');const members=['You',...new Set(names)];if(members.length<2){showToast('Add at least one other person.');return;}const g={id:id(),name:f.name.trim(),members};store.groups.push(g);persist();tabTo('groups');navTo('groupDetail',{id:g.id});showToast('Local group created');}
function calculatedSplit(f,group,total){const people=group.members;if(f.splitMode==='equal')return equalShares(total,people);const vals=people.map(m=>Number(f.shares?.[m]||0));if(vals.some(x=>!Number.isFinite(x)||x<0)){showToast('Split values must be zero or positive.');return null;}if(f.splitMode==='exact'){const cents=vals.map(x=>minor(x));if(cents.reduce((a,b)=>a+b,0)!==total){showToast(`Exact splits must total ${amount(total)}.`);return null;}return Object.fromEntries(people.map((p,i)=>[p,cents[i]]));}const sum=vals.reduce((a,b)=>a+b,0);if(!(sum>0)){showToast('Enter positive percentages or shares.');return null;}if(f.splitMode==='percentage'&&Math.abs(sum-100)>0.001){showToast('Percentages must total 100%.');return null;}const raw=vals.map(x=>total*x/sum);const out=raw.map(Math.floor);let remainder=total-out.reduce((a,b)=>a+b,0);const rank=raw.map((x,i)=>({i,frac:x-out[i]})).sort((a,b)=>b.frac-a.frac);for(let i=0;i<remainder;i++)out[rank[i%rank.length].i]++;return Object.fromEntries(people.map((p,i)=>[p,out[i]]));}
function saveGroupExpense(){const g=store.groups.find(x=>x.id===ui.params.id),f=ui.form,total=minor(f.amountText);if(!g||!(total>0)||!f.title?.trim()){showToast('Enter a description and valid amount.');return;}const shares=calculatedSplit(f,g,total);if(!shares)return;if(f.paidBy==='You'&&!accountBy(f.accountId)){showToast('Choose the account that paid.');return;}const xid=id();store.groupExpenses.push({id:xid,groupId:g.id,title:f.title.trim(),amount:total,paidBy:f.paidBy,accountId:f.paidBy==='You'?f.accountId:null,shares,splitMode:f.splitMode,date:f.date||iso()});if(f.paidBy==='You')store.transactions.push({id:id(),groupExpenseId:xid,type:'groupExpense',title:f.title.trim(),amount:total,personalShare:shares.You,accountId:f.accountId,category:'Shared expenses',date:f.date||iso(),source:'group',createdAt:Date.now()});else if(shares.You>0)store.transactions.push({id:id(),groupExpenseId:xid,type:'groupShare',title:f.title.trim()+' · Your share',amount:shares.You,accountId:null,category:'Shared expenses',date:f.date||iso(),source:'group',createdAt:Date.now()});persist();navTo('groupDetail',{id:g.id});showToast('Group expense recorded locally');}
function saveDebt(){const f=ui.form,amountVal=minor(f.amountText);if(!f.person?.trim()||!(amountVal>0)||!accountBy(f.accountId)){showToast('Enter person, account and positive amount.');return;}const debt={id:id(),person:f.person.trim(),kind:f.kind,amount:amountVal,settled:0,accountId:f.accountId,reason:f.reason,date:f.date||iso(),dueDate:f.dueDate,phone:f.phone,payments:[]};store.debts.push(debt);store.transactions.push({id:id(),type:f.kind,title:`${f.kind==='lend'?'Lent to':'Borrowed from'} ${debt.person}`,amount:amountVal,accountId:f.accountId,category:'Debt principal',date:debt.date,source:'debt',createdAt:Date.now(),debtId:debt.id});persist();tabTo('more');navTo('debts');showToast('Debt recorded, not counted as income or spending');}
function saveRecurring(){const f=ui.form,amt=minor(f.amountText);if(!f.name?.trim()||!(amt>0)||!f.nextDate){showToast('Enter name, amount and next due date.');return;}const old=store.recurring.find(x=>x.id===ui.params.id);const r={...f,id:old?.id||id(),amount:amt,name:f.name.trim(),lastPaidDate:old?.lastPaidDate||null};delete r.amountText;if(old)Object.assign(old,r);else store.recurring.push(r);persist();tabTo('more');navTo('recurring');showToast('Recurring reminder saved');}
function saveForm(){if(ui.saving)return;ui.saving=true;try{switch(ui.page){case'transactionForm':saveTransaction();break;case'accountForm':saveAccount();break;case'transferForm':saveTransfer();break;case'giftForm':saveGift();break;case'groupForm':saveGroup();break;case'groupExpenseForm':saveGroupExpense();break;case'goalForm':saveGoal();break;case'budgetForm':saveBudget();break;case'debtForm':saveDebt();break;case'recurringForm':saveRecurring();break;}}finally{ui.saving=false;}}
function downloadFile(contents,name,mime='application/json'){const blob=new Blob([contents],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function csvCell(value){let s=String(value??'');if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}
function exportCSV(){const rows=[['Date','Type','Title','Amount','Currency','Account','To account','Category','Notes']];for(const t of store.transactions.filter(x=>!x.deleted)){rows.push([t.date,t.type,t.title,(t.amount/100).toFixed(2),accountBy(t.accountId)?.currency||'INR',accountName(t.accountId),t.toAccountId?accountName(t.toAccountId):'',t.category||'',t.note||'']);}downloadFile('\ufeff'+rows.map(row=>row.map(csvCell).join(',')).join('\r\n'),`traxos-transactions-${iso()}.csv`,'text/csv;charset=utf-8');showToast('CSV downloaded (unencrypted)');}
function parseSmart(text){if(!store.settings.smartImport){showToast('Enable Smart message review in Settings first.');return null;}if(!text.trim()){showToast('Paste a financial message first.');return null;}if(/\b(otp|verification code|one.time password|cvv)\b/i.test(text)){showToast('Security-code messages are intentionally ignored.');return null;}const m=text.match(/(?:₹|rs\.?|inr)\s*([\d,]+(?:\.\d{1,2})?)/i)||text.match(/\b([\d,]+(?:\.\d{1,2})?)\s*(?:rupees|rupaye)\b/i);if(!m){showToast('Could not find an INR amount. Please enter a transaction manually.');return null;}const val=minor(m[1].replace(/,/g,''));if(!(val>0)){showToast('Could not read a positive amount.');return null;}
const type=/(credited|received|deposit(?:ed)?|refund)/i.test(text)&&!/(debited|spent|paid|withdrawn)/i.test(text)?'income':'expense';const tail=text.match(/(?:to|at|from|by)\s+([A-Za-z][A-Za-z0-9 &.'-]{2,40})/i);const merchant=(tail?.[1]||'Bank transaction').replace(/\b(on|ref|upi|a\/c|account|dated)\b.*$/i,'').trim();const ref=text.match(/(?:ref(?:erence)?|utr|txn|transaction id)[:\s#-]*([A-Za-z0-9]{7,})/i)?.[1]||'';const suffix=text.match(/(?:xx|\*\*|\*{2,}|ending\s+)(\d{4})/i)?.[1];const account=store.accounts.find(a=>a.cardLast4===suffix)||store.accounts.find(a=>a.type==='bank')||store.accounts[0];if(ref&&(store.candidates.some(c=>c.ref===ref)||store.transactions.some(t=>!t.deleted&&t.ref===ref)||store.ignoredRefs.includes(ref))){showToast('Possible duplicate: reference already exists.');return null;}if(!ref&&(store.candidates.some(c=>c.status==='pending'&&c.amount===val&&c.type===type&&c.accountId===account?.id&&c.title.toLowerCase()===merchant.toLowerCase()&&c.date===iso())||store.transactions.some(t=>!t.deleted&&t.amount===val&&t.type===type&&t.accountId===account?.id&&t.title.toLowerCase()===merchant.toLowerCase()&&t.date===iso()))){showToast('Possible duplicate payment detected. Review existing entries.');return null;}
const candidate={id:id(),title:merchant||'Bank transaction',amount:val,type,accountId:account?.id||'',category:type==='income'?'Other income':'Other expense',date:iso(),ref,source:'Pasted message',status:'pending'};store.candidates.unshift(candidate);persist();return candidate;}
function parsedVoice(text){const m=text.match(/(?:₹|rs\.?|inr)?\s*(\d+(?:\.\d{1,2})?)\s*(?:rupees?|rupaye|rs)?/i);if(!m)return null;const v=Number(m[1]);if(!(v>0))return null;const t=text.toLowerCase();let category=/lunch|dinner|breakfast|coffee|tea|chai|food/.test(t)?'Food & drink':/petrol|fuel|bus|train|taxi|uber|auto/.test(t)?'Transport':/grocery|vegetable|supermarket/.test(t)?'Groceries':/rent|bill|electricity|wifi/.test(t)?'Bills':'Other expense';return {amountText:String(v),title:text.trim(),category,type:/salary|received|earned/.test(t)?'income':'expense',date:/yesterday/.test(t)?new Date(Date.now()-86400000).toLocaleDateString('en-CA'):iso(),accountId:store.accounts.find(a=>t.includes(a.name.toLowerCase()))?.id||store.settings.defaultAccount||store.accounts[0]?.id||''};}
async function readClipboard(field='smartText'){try{const txt=await navigator.clipboard.readText();const el=$(`[data-bind-ui="${field}"]`,app);if(el){el.value=txt;el.dispatchEvent(new Event('input',{bubbles:true}));}showToast('Pasted from clipboard');}catch{showToast('Clipboard unavailable. Long-press the field to paste.');}}

 case 'approveCandidate':{const c=store.candidates.find(x=>x.id===aid);if(!c||c.status!=='pending')return; if(c.ref&&store.transactions.some(t=>!t.deleted&&t.ref===c.ref)){showToast('This reference is already in your ledger.');return;}store.transactions.push({id:id(),type:c.type,title:c.title,amount:c.amount,accountId:c.accountId,category:c.category,date:c.date,source:c.source,ref:c.ref,createdAt:Date.now()});c.status='approved';persist();render();showToast('Suggestion added to Activity',{label:'Undo',fn:()=>{const t=store.transactions.find(t=>t.ref&&t.ref===c.ref);if(t)t.deleted=true;c.status='pending';persist();render();}});break;}
 case 'rejectCandidate':{const c=store.candidates.find(x=>x.id===aid);if(c){c.status='ignored';if(c.ref)store.ignoredRefs.push(c.ref);persist();render();showToast('Suggestion ignored');}break;}

 case 'addDebt':navTo('debtForm');break;case 'debtKind':ui.form.kind=v;render();break;case 'debtDetail':navTo('debtDetail',{id:aid});break;
 case 'repayDebt':openMoney('Record repayment','Repayments reduce the outstanding principal without creating new income or spending.','debtRepay',aid,'Record repayment');break;
 case 'shareDebt':{const d=store.debts.find(x=>x.id===aid);if(!d)return;const remaining=amount(d.amount-d.settled);ui.sheetForm.shareMessage=d.kind==='lend'?`Hi ${d.person}, just a friendly reminder about the ${remaining} remaining for ${d.reason||'our expense'}${d.dueDate?', due '+dateLocal(d.dueDate):''}. Please let me know when convenient. Thanks!`:`Hi ${d.person}, I have ${remaining} remaining to repay for ${d.reason||'our expense'}. I'll update you when I've made the payment.`;ui.sheet={kind:'shareDebt',target:aid};render();break;}
 case 'shareReminder':{const t=ui.sheetForm.shareMessage||'';if(navigator.share){navigator.share({text:t}).catch(()=>{});showToast('Sharing requested; sending is controlled by you');}else if(navigator.clipboard){navigator.clipboard.writeText(t).then(()=>showToast('Reminder copied')).catch(()=>showToast('Select and copy the message manually'));}else showToast('Select and copy the message manually');ui.sheet=null;render();break;}
 case 'addRecurring':navTo('recurringForm');break;case 'editRecurring':navTo('recurringForm',{id:aid});break;case 'recurringDetail':navTo('recurringDetail',{id:aid});break;
 case 'confirmRecurring':{const r=store.recurring.find(x=>x.id===aid);if(!r||r.status!=='active'){showToast('This recurring rule is not active.');return;}ask('Record this payment?',`Confirm that ${r.name} for ${amount(r.amount)} was actually paid. This will create one expense and advance the reminder.`,()=>{const chargeDate=r.nextDate;r.nextDate=nextRecurrence(r.nextDate,r.frequency);r.lastPaidDate=chargeDate;store.transactions.push({id:id(),type:'expense',title:r.name,amount:r.amount,category:r.category||'Bills',accountId:r.accountId,date:iso(),createdAt:Date.now(),recurringId:r.id,source:'recurring'});persist();render();showToast('Payment recorded; next reminder scheduled');},'Mark paid & record');break;}
 case 'downloadJSON':downloadFile(JSON.stringify(store,null,2),`traxos-demo-backup-${iso()}.json`);showToast('JSON backup downloaded (unencrypted)');break;
 case 'downloadCSV':exportCSV();break;case 'restoreTrigger':$('#restorePicker',app)?.click();break;
 case 'confirmRestore':{if(!ui.restoreData)return;store=dataClone(ui.restoreData);ui.restoreData=null;ui.sheet=null;persist();tabTo('home');showToast('Demo data restored');break;}
 case 'resetDemo':ask('Reset the prototype?', 'This replaces all existing demo records with the original screenshot-inspired sample. Export first if you wish to keep changes.',()=>{store=seed();persist();tabTo('home');showToast('Sample demo restored');},'Reset demo',true);break;
 case 'parseVoice':{const txt=$('[data-bind-ui="voiceText"]',app)?.value||'';const draft=parsedVoice(txt);if(!draft){showToast('Could not find an amount in that phrase.');return;}navTo('transactionForm');ui.form={...draft,source:'voice preview',note:'Transcribed text preview — review before saving'};ui.moreDetails=true;render();showToast('Review the voice draft before saving');break;}
 case 'closeSheet':ui.sheet=null;render();break;
 case 'confirmAction':{const fn=ui.sheet?.onConfirm;ui.sheet=null;render();if(fn)fn();break;}
 case 'confirmMoney':{const s=ui.sheet,v=minor($('[data-bind="sheetAmount"]',app)?.value||0);if(!s||!(v>0)){showToast('Enter an amount greater than zero.');return;}if(s.action==='goalAdd'||s.action==='goalWithdraw'){const g=store.goals.find(g=>g.id===s.target);if(!g)return;if(s.action==='goalWithdraw'&&v>g.saved){showToast('You cannot withdraw more than allocated.');return;}g.saved+=s.action==='goalAdd'?v:-v;}
 else if(s.action==='giftRedeem'){const g=store.gifts.find(g=>g.id===s.target);if(!g)return;if(v>g.balance){showToast('Gift balance is not enough.');return;}g.balance-=v;if(g.balance===0)g.status='redeemed';}
 else if(s.action==='debtRepay'){const d=store.debts.find(d=>d.id===s.target);if(!d)return;if(v>d.amount-d.settled){showToast('Repayment exceeds outstanding balance.');return;}d.settled+=v;d.payments.push({id:id(),date:iso(),amount:v});store.transactions.push({id:id(),type:d.kind==='lend'?'repayLend':'repayBorrow',title:`Repayment · ${d.person}`,amount:v,accountId:d.accountId,category:'Debt repayment',date:iso(),createdAt:Date.now(),debtId:d.id,source:'debt'});}
 else if(s.action==='groupSettle'){const g=store.groups.find(x=>x.id===s.target);if(!g)return;const nets=groupNet(g),mine=nets.You||0;if(v>Math.abs(mine)){showToast('Settlement is more than your balance.');return;}const counter=g.members.find(m=>m!=='You'&&Math.sign(nets[m]||0)===-Math.sign(mine));if(!counter){showToast('No matching member found for settlement.');return;}const acc=$('[data-sheet-account]',app)?.value||store.settings.defaultAccount||'bank';const from=mine>0?counter:'You',to=mine>0?'You':counter;store.groupSettlements.push({id:id(),groupId:g.id,from,to,amount:v,date:iso()});store.transactions.push({id:id(),type:'groupSettlement',title:`${mine>0?'Reimbursement from':'Settlement to'} ${counter}`,amount:v,accountId:acc,direction:mine>0?'received':'paid',category:'Group settlement',date:iso(),source:'group',createdAt:Date.now()});}
 ui.sheet=null;persist();render();showToast('Recorded locally');break;}
 case 'toastUndo':{const fn=ui.toast?.action?.fn;ui.toast=null;clearTimeout(toastTimer);if(fn)fn();else render();break;}
 default:if(act)showToast('This action is not available in the browser prototype.');
}}
app.addEventListener('click',e=>{const target=e.target.closest('[data-action]');if(target){e.preventDefault();onAction(target);return;}if(e.target.dataset.overlay==='true'){ui.sheet=null;render();}});
app.addEventListener('input',e=>{const el=e.target;if(el.dataset.bind){ui.form[el.dataset.bind]=el.value;}if(el.dataset.bindSheet){ui.sheetForm[el.dataset.bindSheet]=el.value;}if(el.dataset.splitMember){ui.form.shares=ui.form.shares||{};ui.form.shares[el.dataset.splitMember]=el.value;}if(el.dataset.settingInput){store.settings[el.dataset.settingInput]=el.value;persist();}if(el.dataset.bindUi==='search'){ui.search=el.value;const cursor=el.selectionStart;render();const field=$('#searchField',app);if(field){field.focus();try{field.setSelectionRange(cursor,cursor);}catch{}}}});
app.addEventListener('change',e=>{const el=e.target;if(el.dataset.bind){ui.form[el.dataset.bind]=el.value;if(['type','paidBy','splitMode'].includes(el.dataset.bind)){render();}}if(el.dataset.bindSheet){ui.sheetForm[el.dataset.bindSheet]=el.value;}if(el.id==='restorePicker'){const file=el.files?.[0];if(!file)return;file.text().then(txt=>{const incoming=JSON.parse(txt);if(incoming.version!==3||!Array.isArray(incoming.accounts)||!Array.isArray(incoming.transactions)||!Array.isArray(incoming.gifts)||!Array.isArray(incoming.groups)||!Array.isArray(incoming.recurring)||!incoming.categories||!Array.isArray(incoming.categories.expense)||!Array.isArray(incoming.categories.income)||!incoming.settings){throw Error('Invalid Traxos demo v3 backup');}if(incoming.accounts.length>100000||incoming.transactions.length>100000)throw Error('File too large for this demo');ui.restoreData=incoming;ui.sheet={kind:'restore'};render();}).catch(ex=>showToast('Restore failed: '+ex.message));}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(ui.sheet||ui.menu||ui.page!=='home'){e.preventDefault();back();}}});
// Keep a transaction draft when temporarily creating an account from a picker.
const previousSaveAccount=saveAccount;
saveAccount=function(){const oldLen=store.accounts.length;previousSaveAccount();if(ui.resumeAfterAccount&&store.accounts.length>oldLen){const last=store.accounts.at(-1),resume=ui.resumeAfterAccount;ui.resumeAfterAccount=null;ui.page=resume.page;ui.params=resume.params;ui.form=resume.form;ui.form.accountId=last.id;ui.history=[{page:'accounts',params:{}}];render();showToast('New account selected in your draft');}};
// Candidate edit drafts use the review record, not a posted ledger entry.
const previousInitTransaction=initTransaction;
initTransaction=function(){if(ui.params.candidateId){const c=store.candidates.find(c=>c.id===ui.params.candidateId);if(c){ui.form={type:c.type,amountText:(c.amount/100).toFixed(2),accountId:c.accountId,category:c.category,title:c.title,note:'',date:c.date,source:c.source,fromCandidate:c.id,ref:c.ref};ui.moreDetails=true;return;}}previousInitTransaction();};
render();
})();
